html[data-fx=off] *,html[data-fx=off] ::before,html[data-fx=off] ::after{animation:none!important;transition:none!important}html[data-fx=off]::after{display:none}
/* ---- écran d'accueil ---- */
@keyframes kb{from{scale:.94}to{scale:1}}
@keyframes ssl{from{translate:30% 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes srv{from{clip-path:circle(0% at 50% 60%)}to{clip-path:circle(150% at 50% 60%)}}
@keyframes so{to{opacity:0;scale:1.08;filter:blur(8px)}}
#sp{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:24px 24px calc(40px + env(safe-area-inset-bottom,0px));color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c2) 60%,#000));animation:fd .4s both}
#sp .sbg{position:absolute;inset:-8%;z-index:-3;background:center/cover no-repeat;filter:blur(24px) brightness(.7) saturate(1.15)}
#sp .si{position:absolute;inset:0;z-index:-2;background:center/contain no-repeat}
#sp::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.12) 55%,rgba(0,0,0,.35))}
#sp h1{font-size:clamp(30px,9vw,46px);line-height:1.08;margin:0 0 10px;font-weight:800;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.5)}
#sp p{margin:0 0 22px;font-size:17px;max-width:420px;animation:up .7s .9s both}
#sp .wd{display:inline-block;animation:wd .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--w)*80ms + .5s)}
#sp .b{width:100%;max-width:360px;font-size:17px;padding:15px 18px;background-color:var(--c2);color:var(--c2t,#1B1A18);animation:up .7s 1.2s both,pl 2.2s 2s infinite}
#sp.sp-zoom .si{animation:kb 3.5s cubic-bezier(.16,1,.3,1) both}#sp.sp-fade .si{animation:fd 1.8s both}#sp.sp-slide .si{animation:ssl 1s cubic-bezier(.2,.8,.2,1) both}#sp.sp-rev .si{animation:srv 1.3s cubic-bezier(.7,0,.2,1) both}
#sp.out{animation:so .6s ease-in both;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
/* ---- CORRECTIF : blocage en haut de page (animations allégées) ---- */
.brand b,#ag h2{animation:none;background:none;-webkit-text-fill-color:var(--tx);color:var(--tx)}
.hero::before,.hero .b,.st.on::before,.fab{animation:none}
#sp .b{animation:up .7s 1.2s both}
.w:not(.aw)>h2{animation:none}
.ov{backdrop-filter:none;-webkit-backdrop-filter:none;overscroll-behavior:contain}
.sh{overscroll-behavior:contain}
/* ---- Logo : forme d'origine (plus de rond) ---- */
.brand img{width:auto;height:auto;max-width:min(72vw,280px);max-height:190px;aspect-ratio:auto;object-fit:contain;border:0;border-radius:18px;background:none;box-shadow:none}
/* ---- Relief : bandeau défilant, cartes produits, boutons ---- */
.mq{--mb:color-mix(in srgb,var(--c1) 16%,#141210);position:relative;background:var(--mb);color:#fff;border:1px solid color-mix(in srgb,var(--c1) 70%,transparent);box-shadow:0 8px 22px -8px color-mix(in srgb,var(--c1) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.22);font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin:6px 0 18px}
.mq div{padding:11px 0}
.mq span{padding:0}
.mq span::after{content:"\2726";color:var(--c2);margin:0 22px;text-shadow:0 0 8px var(--c1)}
.mq::before,.mq::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:1;pointer-events:none}
.mq::before{left:0;background:linear-gradient(90deg,var(--mb),transparent)}
.mq::after{right:0;background:linear-gradient(270deg,var(--mb),transparent)}
.pc{position:relative;border:1px solid color-mix(in srgb,var(--c1) 45%,var(--ln));border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--cd) 82%,#fff),var(--cd) 55%,color-mix(in srgb,var(--cd) 85%,#000));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 40%,#000),0 16px 24px -12px rgba(0,0,0,.65);transition:transform .25s,box-shadow .25s}
.pc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25)}
.pc .ph{position:relative;box-shadow:inset 0 -26px 30px -18px rgba(0,0,0,.55)}
.pc .ph::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 38%)}
.pc .pi{padding:12px 12px 14px}
.pc .pi>b{display:block;font-weight:800;font-size:16px;line-height:1.2}
.pc .pi .mu{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:99px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:0 4px 10px -3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35)}
@media(hover:hover){.pc:hover{transform:perspective(800px) translateY(-7px) rotateX(3deg);box-shadow:0 8px 0 color-mix(in srgb,var(--c1) 40%,#000),0 26px 34px -14px rgba(0,0,0,.7)}}
.pc:active,.pc:hover:active{transform:perspective(800px) translateY(3px) rotateX(5deg) scale(.985);box-shadow:0 1px 0 color-mix(in srgb,var(--c1) 40%,#000),0 6px 12px -6px rgba(0,0,0,.6)}
.hero{box-shadow:0 18px 34px -16px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.inf>div,.g2 .cd,.fq{box-shadow:0 8px 18px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.b:not(.b2):not(:disabled){box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 55%,#000),0 10px 16px -8px rgba(0,0,0,.6)}
.b:not(.b2):not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--c1) 55%,#000)}
/* ---- Relief partout ---- */
.brand b{text-shadow:0 2px 0 color-mix(in srgb,var(--c1) 60%,#000),0 8px 18px rgba(0,0,0,.45)}
.brand img{filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.hero h1{text-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.45)}
.w:not(.aw)>h2{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.num{text-shadow:0 2px 0 rgba(0,0,0,.2)}
.ch{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.ch.on{box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 60%,#000),inset 0 1px 0 rgba(255,255,255,.25)}

.b2{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}

.cd,.tx,.lab,.wn,.bm{box-shadow:0 8px 18px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.pr{box-shadow:0 4px 0 color-mix(in srgb,var(--c2) 55%,#000),0 12px 18px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.bm.u{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 65%,#000))}
.nb{background:linear-gradient(145deg,var(--c1),color-mix(in srgb,var(--c1) 60%,#000));box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 40%,#000),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.em2{filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
@media(hover:hover){.g2 .cd{transition:transform .25s,box-shadow .25s}.g2 .cd:hover{transform:translateY(-5px);box-shadow:0 18px 26px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.2)}}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select,textarea{box-shadow:inset 0 2px 5px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.12)}
.sh{border-top:1px solid color-mix(in srgb,var(--c1) 50%,transparent);box-shadow:0 -14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.sh::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--tx) 30%,transparent);margin:8px auto 4px}
.sl>*{box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.ts{box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--c1) 60%,transparent)}
.aw .bar{box-shadow:0 8px 14px -10px rgba(0,0,0,.6)}
/* ---- Infos et horaires détaillés ---- */
.inf{gap:12px}
.inf>.ib{position:relative;overflow:hidden;padding:12px 14px 12px 18px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--cd) 85%,#fff),var(--cd))}
.inf>.ib::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ih i{font-style:normal;display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:10px;font-size:16px;background:linear-gradient(145deg,var(--c1),color-mix(in srgb,var(--c1) 60%,#000));box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 40%,#000),inset 0 1px 0 rgba(255,255,255,.4)}

.inf .st{display:inline-block;padding:4px 11px;border-radius:99px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(217,45,32,.55);color:color-mix(in srgb,#D92D20 55%,var(--tx))}
.inf .st.on{background:rgba(30,158,87,.2);box-shadow:inset 0 0 0 1px rgba(30,158,87,.7);color:color-mix(in srgb,#1E9E57 55%,var(--tx))}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chp{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.1)}
.chp.hot{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 3px 8px -3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.hrs{margin:12px 0 4px}
.hrs summary{list-style:none;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;font-weight:700;color:var(--tx);background:var(--cd);border:1px solid var(--ln);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.hrs summary::-webkit-details-marker{display:none}
.hrs summary::after{content:"\25BE";transition:transform .2s}
.hrs[open] summary::after{transform:rotate(180deg)}
.hrs .t3{align-items:center;padding:10px 12px;margin-top:6px;border-radius:12px;font-size:14px;background:var(--cd);box-shadow:0 5px 12px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.hrs .t3 span:first-child{display:flex;flex-direction:column;gap:2px}
.hrs .th3{background:none;box-shadow:none;padding:8px 12px 0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.t3 em{font-style:normal;font-size:11px;font-weight:800;color:var(--c2)}
.hrs .today{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 35%,var(--cd)),var(--cd));box-shadow:0 0 0 2px var(--c1),0 10px 18px -8px rgba(0,0,0,.6)}
.hrs .off{opacity:.55}
.hrs small{font-size:10px;font-weight:700;color:var(--c2);margin-left:4px}

/* ---- Titres en 3D ---- */
:root{--x3a:color-mix(in srgb,var(--c1) 78%,#000);--x3b:color-mix(in srgb,var(--c1) 55%,#000);--x3c:color-mix(in srgb,var(--c1) 35%,#000);--x3:-1px -1px 0 rgba(255,255,255,.45),0 1px 0 var(--x3a),0 2px 0 var(--x3a),0 3px 0 var(--x3b),0 4px 0 var(--x3b),0 5px 0 var(--x3c),0 6px 5px rgba(0,0,0,.4),0 10px 16px rgba(0,0,0,.35)}
html[data-t3=off]{--x3:none}
.brand b,.w:not(.aw)>h2,.sh h2,.agc h2,#sp h1{text-shadow:var(--x3);letter-spacing:.01em}
.brand b{padding-bottom:8px}
.w:not(.aw)>h2{padding-bottom:9px}
/* ---- Bouton COMMANDER centré (sans bannière) ---- */
.cta{display:flex;justify-content:center;margin:0 0 10px}
.cta .b{min-width:min(100%,280px);padding:16px 34px;font-size:19px;letter-spacing:.05em;border-radius:16px}
body.an .cta{animation:up .6s .1s both}
/* ---- Villes livrées ---- */
.zg{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--cd);box-shadow:0 5px 12px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.zg>b{display:block;margin-bottom:8px;font-size:18px;color:var(--c2)}

/* ---- Typographies secondaires ---- */
:root{--f2:'DM Sans',system-ui,sans-serif;--f3:'Oswald','Bricolage Grotesque',system-ui,sans-serif}
.mu,.sh p,.tx p,.fq p,.ft,.wn,label,input,select,textarea,.bm,.sp .mu,.cd .mu,.chp,.ol,.pk{font-family:var(--f2)}
.sh .mu,.sh p,.tx p,.fq p{line-height:1.65;font-size:15px}
.ih b,.th3 b,.st,.ch,.lt,.ln,.as span,.trk span,.sb{font-family:var(--f3);text-transform:uppercase;letter-spacing:.09em}
.ch{font-size:13px}.tm,.pp,.num,.tt.big{font-family:var(--f3);letter-spacing:.03em}
.pc .pi .mu{font-family:var(--f3);letter-spacing:.04em}
.pc .pi>b{letter-spacing:-.005em}
.sh h3{font-family:var(--f3);text-transform:uppercase;letter-spacing:.1em;font-size:15px;color:var(--c2)}
.fq summary b{font-family:var(--f2);font-weight:700}
/* ---- Espace client & carte de fidélité ---- */
.lc{position:relative;overflow:hidden;border-radius:20px;padding:16px;margin:14px 0;color:#fff;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 50%,#000) 70%,color-mix(in srgb,var(--c2) 55%,#000));box-shadow:0 16px 28px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.lc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%)}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.lt{font-size:13px;opacity:.9}.lb{font-weight:800;font-size:15px;text-align:right;overflow-wrap:anywhere}
.ls{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:8px;margin:14px 0 12px}

.ls i.on{background:linear-gradient(145deg,#fff,var(--c2));color:var(--c1);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 #fff}
.ls i.gf{font-size:19px;border:2px dashed rgba(255,255,255,.6)}.ls i.gf.on{border-color:#fff;background:linear-gradient(145deg,#fff,var(--c2))}
.lf{font-weight:700;line-height:1.3}.ln{font-size:11px;opacity:.85;margin-top:6px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.pk span{padding:10px 12px;border-radius:12px;background:var(--cd);font-size:14px;font-weight:600;box-shadow:0 5px 12px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.ah{display:flex;align-items:center;gap:14px;margin:6px 0 12px}.ah h2{font-size:22px}
.av{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f3);font-size:26px;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 45%,#000),inset 0 1px 0 rgba(255,255,255,.4)}
.as{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.as>div{text-align:center;padding:10px 6px;border-radius:14px;background:var(--cd);box-shadow:0 6px 14px -9px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.as b{display:block;font-size:18px;font-weight:800;color:var(--c2)}.as span{font-size:10px;color:var(--mu)}
.oc{margin:10px 0;padding:12px 14px;border-radius:16px;background:var(--cd);border-left:4px solid var(--c1);box-shadow:0 8px 18px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.trk{display:flex;justify-content:space-between;margin:10px 0}.trk span{flex:1;text-align:center;font-size:10px;color:var(--mu)}.trk i{display:grid;place-items:center;margin:0 auto 4px;width:24px;height:24px;border-radius:50%;font-style:normal;font-weight:800;font-size:12px;background:rgba(0,0,0,.3)}
.trk span.on{color:var(--tx)}.trk span.on i{background:#1E9E57;color:#fff}
.sb{display:inline-block;margin:8px 0;padding:4px 12px;border-radius:99px;font-size:11px;background:rgba(217,45,32,.25);color:#ff8a80}
.ol{margin:6px 0 10px;padding-left:18px;font-size:14px}

/* ---- Carte à points ---- */
.lp{display:flex;align-items:baseline;gap:8px;margin:10px 0 6px}.lp b{font-family:var(--f3);font-size:46px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}.lp span{font-family:var(--f3);text-transform:uppercase;letter-spacing:.12em;font-size:13px;opacity:.85}
.bar2{height:12px;border-radius:99px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.5);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#fff,var(--c2));box-shadow:0 0 10px rgba(255,255,255,.6)}
.lc .lf{margin-top:10px}.lr{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.lr span{display:flex;flex-direction:column;padding:7px 12px;border-radius:12px;font-weight:700;font-size:14px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.18);opacity:.75}.lr span small{font-family:var(--f3);letter-spacing:.08em;font-size:11px;opacity:.85}.lr span.on{opacity:1;background:linear-gradient(145deg,#fff,var(--c2));color:var(--c1);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 #fff}
.lw{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--cd);border:1px solid var(--ln)}
/* ---- Fiche produit ---- */
.cat{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;font-family:var(--f3);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 45%,#000),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.sh .pd{margin:8px 0 12px;padding:12px 14px;border-radius:14px;border-left:4px solid var(--c2);background:rgba(0,0,0,.2);box-shadow:inset 0 2px 6px rgba(0,0,0,.3);font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:17px;line-height:1.75;white-space:pre-line;color:var(--tx)}
.ef{margin:8px 0;font-family:var(--f2)}.ef span{display:inline-block;margin-right:8px;padding:2px 10px;border-radius:99px;font-family:var(--f3);text-transform:uppercase;letter-spacing:.1em;font-size:12px;background:var(--c2);color:var(--c2t,#1B1A18)}
.sh .pp{display:inline-block;margin:8px 0;padding:6px 16px;border-radius:12px;font-family:var(--f3);font-size:28px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 45%,#000),0 12px 18px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sh label.ck{padding:10px 12px;margin:8px 0;border-radius:12px;background:var(--cd);font-family:var(--f2);font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.tx p,.fq p,.g2 .mu,.sp .mu{font-family:'Fraunces',Georgia,serif;font-style:italic;line-height:1.65}

const DESCFN="// Fonction Supabase « describe » : rédige les descriptions produits (réservée à l'administrateur).\n// Utilise l'API gratuite de Groq. Secrets : GROQ_API_KEY (obligatoire), GROQ_MODEL (facultatif).\nconst SU = Deno.env.get(\"SUPABASE_URL\")!;\nconst SK = Deno.env.get(\"SUPABASE_SERVICE_ROLE_KEY\")!;\nconst AK = Deno.env.get(\"GROQ_API_KEY\") || \"\";\nconst MODEL = Deno.env.get(\"GROQ_MODEL\") || \"llama-3.3-70b-versatile\";\nconst FALLBACKS = [\"llama-3.1-8b-instant\"];\nconst CORS = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"authorization, x-client-info, apikey, content-type\",\n  \"Access-Control-Allow-Methods\": \"POST, OPTIONS\",\n};\nconst J = (o: unknown, s = 200) =>\n  new Response(JSON.stringify(o), { status: s, headers: { ...CORS, \"Content-Type\": \"application/json\" } });\n\nasync function isAdmin(req: Request) {\n  const t = (req.headers.get(\"authorization\") || \"\").replace(/^Bearer\\s+/i, \"\");\n  if (!t) return false;\n  const r = await fetch(`${SU}/auth/v1/user`, { headers: { apikey: SK, Authorization: `Bearer ${t}` } });\n  if (!r.ok) return false;\n  const u = await r.json();\n  if (!u?.id) return false;\n  const p = await (await fetch(`${SU}/rest/v1/profiles?select=is_admin&id=eq.${u.id}`, {\n    headers: { apikey: SK, Authorization: `Bearer ${SK}` },\n  })).json();\n  return !!p?.[0]?.is_admin;\n}\n\nconst SYSTEM = [\n  \"Tu es rédacteur e-commerce pour une boutique en ligne francophone. Écris toujours en français.\",\n  \"À partir du nom du produit et de 2 à 3 mots-clés, écris une description courte (3 à 5 phrases, 60 à 90 mots), vivante et enjouée, qui donne envie d'acheter.\",\n  \"Termine par un appel à l'action (ex. Commandez-le dès maintenant). Place 3 à 6 emojis bien choisis, sans en abuser. Vouvoie le client.\",\n  \"Règles : n'invente aucun fait (taux, origine, laboratoire, prix) absent des infos fournies ; aucune promesse de santé ou thérapeutique (soulage, soigne, traite…) ; aucune allégation d'effets ; produit réservé aux adultes.\",\n  \"Réponds uniquement avec le texte de la description, sans titre ni guillemets.\",\n].join(\"\\n\");\n\nconst ask = (model: string, info: string) =>\n  fetch(\"https://api.groq.com/openai/v1/chat/completions\", {\n    method: \"POST\",\n    headers: { Authorization: `Bearer ${AK}`, \"Content-Type\": \"application/json\" },\n    body: JSON.stringify({\n      model,\n      max_tokens: 400,\n      temperature: 0.8,\n      messages: [{ role: \"system\", content: SYSTEM }, { role: \"user\", content: info }],\n    }),\n  });\n\nDeno.serve(async (req) => {\n  if (req.method === \"OPTIONS\") return new Response(\"ok\", { headers: CORS });\n  try {\n    if (!(await isAdmin(req))) return J({ ok: false, error: \"Compte administrateur requis.\" }, 403);\n    if (!AK) return J({ ok: false, error: \"Secret GROQ_API_KEY manquant dans Supabase (Edge Functions → Secrets).\" }, 500);\n    const b = await req.json().catch(() => ({}));\n    const cut = (v: unknown, n: number) => String(v || \"\").trim().slice(0, n);\n    const info = [\n      \"Nom : \" + cut(b.n, 120),\n      \"Mots-clés : \" + cut(b.k, 200),\n      b.c ? \"Catégorie : \" + cut(b.c, 60) : \"\",\n      b.p ? \"Prix : \" + cut(b.p, 20) + \" €\" : \"\",\n    ].filter(Boolean).join(\"\\n\");\n\n    const models = Deno.env.get(\"GROQ_MODEL\") ? [MODEL] : [MODEL, ...FALLBACKS];\n    let r: Response | null = null;\n    for (const m of models) {\n      r = await ask(m, info);\n      console.log(\"DESCRIBE groq model=\" + m + \" status=\" + r.status);\n      // 401/403 = clé refusée : inutile d'essayer un autre modèle\n      if (r.ok || r.status === 401 || r.status === 403) break;\n    }\n    const j = await r!.json().catch(() => ({}));\n    if (!r!.ok) {\n      const msg = j?.error?.message || j?.message || \"Erreur du service de rédaction.\";\n      console.error(\"DESCRIBE groq error status=\" + r!.status + \" body=\" + JSON.stringify(j).slice(0, 400));\n      return J({ ok: false, error: \"Groq \" + r!.status + \" : \" + (typeof msg === \"string\" ? msg : JSON.stringify(msg)), upstream: r!.status }, 502);\n    }\n    const text = String(j?.choices?.[0]?.message?.content || \"\").trim();\n    return J({ ok: !!text, text });\n  } catch (e) {\n    console.error(\"DESCRIBE exception \" + String((e as Error)?.message || e));\n    return J({ ok: false, error: String((e as Error)?.message || e) }, 500);\n  }\n});\n";

const IDSQL="-- À lancer UNE fois : Supabase > SQL Editor > New query > Run\nalter table public.profiles add column if not exists id_status text not null default 'none';\nalter table public.profiles add column if not exists id_path text;\nalter table public.profiles add column if not exists id_sign text;\nalter table public.profiles add column if not exists id_sign_at timestamptz;\n\ncreate or replace function public.guard_id() returns trigger language plpgsql as $$\nbegin\n  if (new.id_status is distinct from old.id_status or new.id_path is distinct from old.id_path\n      or new.id_sign is distinct from old.id_sign or new.id_sign_at is distinct from old.id_sign_at)\n     and coalesce(current_setting('app.idv', true), '') <> '1' then\n    raise exception 'interdit';\n  end if;\n  return new;\nend $$;\ndrop trigger if exists guard_id on public.profiles;\ncreate trigger guard_id before update on public.profiles for each row execute function public.guard_id();\n\n-- Signe aléatoire (geste + code à 4 chiffres), valable 60 minutes, généré par le serveur\ncreate or replace function public.id_challenge() returns text\nlanguage plpgsql security definer set search_path = public, extensions as $$\ndeclare\n  uid uuid := auth.uid();\n  g text[] := array[\n    'pouce levé de la main droite', 'deux doigts en « V » de la main gauche', 'main droite ouverte à côté de la joue',\n    'trois doigts levés de la main gauche', 'index droit posé sur le bout du nez', 'poing fermé devant le menton',\n    'main gauche posée sur le sommet de la tête', 'les deux mains ouvertes de chaque côté du visage',\n    'index gauche posé sur la joue', 'quatre doigts levés de la main droite'];\n  code text; sign text;\nbegin\n  if uid is null then raise exception 'Connexion requise.'; end if;\n  code := lpad(((get_byte(gen_random_bytes(2), 0) * 256 + get_byte(gen_random_bytes(2), 1)) % 10000)::text, 4, '0');\n  sign := g[1 + (get_byte(gen_random_bytes(1), 0) % array_length(g, 1))] || ' + feuille de papier avec le code ' || code;\n  perform set_config('app.idv', '1', true);\n  update public.profiles set id_sign = sign, id_sign_at = now() where id = uid;\n  return sign;\nend $$;\nrevoke all on function public.id_challenge() from public, anon;\ngrant execute on function public.id_challenge() to authenticated;\n\ncreate or replace function public.set_id(p_uid uuid, p_status text, p_path text) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare adm boolean; fresh boolean;\nbegin\n  select is_admin into adm from public.profiles where id = auth.uid();\n  if p_uid = auth.uid() and p_status = 'pending' and not coalesce(adm, false) then\n    select (id_sign_at is not null and id_sign_at > now() - interval '60 minutes') into fresh from public.profiles where id = p_uid;\n    if not coalesce(fresh, false) then raise exception 'signe expiré'; end if;\n  elsif coalesce(adm, false) then null;\n  else raise exception 'interdit'; end if;\n  perform set_config('app.idv', '1', true);\n  update public.profiles set id_status = p_status, id_path = p_path where id = p_uid;\nend $$;\ngrant execute on function public.set_id(uuid, text, text) to authenticated;\n\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)\n  values ('ids', 'ids', false, 8388608, array['image/jpeg', 'image/png', 'image/webp'])\n  on conflict (id) do update set file_size_limit = 8388608, allowed_mime_types = array['image/jpeg', 'image/png', 'image/webp'];\ndrop policy if exists \"ids_insert_own\" on storage.objects;\ncreate policy \"ids_insert_own\" on storage.objects for insert to authenticated\n  with check (bucket_id = 'ids' and (storage.foldername(name))[1] = auth.uid()::text);\ndrop policy if exists \"ids_read\" on storage.objects;\ncreate policy \"ids_read\" on storage.objects for select to authenticated\n  using (bucket_id = 'ids' and ((storage.foldername(name))[1] = auth.uid()::text\n    or exists (select 1 from public.profiles where id = auth.uid() and is_admin)));\ndrop policy if exists \"ids_delete_admin\" on storage.objects;\ncreate policy \"ids_delete_admin\" on storage.objects for delete to authenticated\n  using (bucket_id = 'ids' and exists (select 1 from public.profiles where id = auth.uid() and is_admin));";

const LOYSQL=`-- À lancer UNE fois : Supabase > SQL Editor > New query > Run
alter table public.profiles add column if not exists pseudo text;
alter table public.profiles add column if not exists points integer not null default 0;
create unique index if not exists profiles_pseudo_uq on public.profiles (lower(pseudo)) where pseudo is not null;

create or replace function public.guard_pts() returns trigger language plpgsql as $$
begin
  if new.points is distinct from old.points and coalesce(current_setting('app.pts', true), '') <> '1' then
    raise exception 'interdit';
  end if;
  return new;
end $$;
drop trigger if exists guard_pts on public.profiles;
create trigger guard_pts before update on public.profiles for each row execute function public.guard_pts();

create or replace function public.add_points(p_uid uuid, p_delta integer) returns integer
language plpgsql security definer set search_path = public as $$
declare adm boolean; res integer;
begin
  select is_admin into adm from public.profiles where id = auth.uid();
  if not coalesce(adm, false) then raise exception 'interdit'; end if;
  perform set_config('app.pts', '1', true);
  update public.profiles set points = greatest(0, points + p_delta) where id = p_uid returning points into res;
  return res;
end $$;
grant execute on function public.add_points(uuid, integer) to authenticated;`;

create table if not exists public.messages (
  id bigint generated always as identity primary key,
  user_id uuid not null references public.profiles(id) on delete cascade,
  from_admin boolean not null default false,
  body text not null check (char_length(body) between 1 and 1000),
  seen boolean not null default false,
  created_at timestamptz not null default now()
);
create index if not exists messages_user_idx on public.messages (user_id, created_at);
alter table public.messages enable row level security;
drop policy if exists msg_sel on public.messages;
create policy msg_sel on public.messages for select using (user_id = auth.uid() or exists (select 1 from public.profiles where id = auth.uid() and is_admin));
drop policy if exists msg_ins_c on public.messages;
create policy msg_ins_c on public.messages for insert with check (user_id = auth.uid() and from_admin = false and seen = false);
drop policy if exists msg_ins_a on public.messages;
create policy msg_ins_a on public.messages for insert with check (from_admin = true and exists (select 1 from public.profiles where id = auth.uid() and is_admin));
create or replace function public.mark_read(p_uid uuid) returns void
language plpgsql security definer set search_path = public as $$
declare adm boolean;
begin
  select is_admin into adm from public.profiles where id = auth.uid();
  if coalesce(adm, false) then
    update public.messages set seen = true where user_id = p_uid and from_admin = false and not seen;
  elsif auth.uid() = p_uid then
    update public.messages set seen = true where user_id = p_uid and from_admin = true and not seen;
  end if;
end $$;
grant execute on function public.mark_read(uuid) to authenticated;

-- Support : assistant (bot) puis prise en main par la boutique
alter table public.messages add column if not exists from_bot boolean not null default false;
alter table public.messages add column if not exists bot_chat boolean not null default false;
create or replace function public.is_admin() returns boolean language sql stable security definer set search_path = public as $$
  select coalesce((select is_admin from public.profiles where id = auth.uid()), false)
$$;
create table if not exists public.support_threads (
  user_id uuid primary key references public.profiles(id) on delete cascade,
  mode text not null default 'bot' check (mode in ('bot', 'human')),
  needs_human boolean not null default false,
  updated_at timestamptz not null default now()
);
alter table public.support_threads enable row level security;
drop policy if exists support_threads_sel on public.support_threads;
create policy support_threads_sel on public.support_threads for select using (user_id = auth.uid() or public.is_admin());
drop policy if exists msg_ins_c on public.messages;
create policy msg_ins_c on public.messages for insert with check (user_id = auth.uid() and from_admin = false and seen = false and from_bot = false and bot_chat = false);
drop policy if exists msg_ins_bot on public.messages;
create policy msg_ins_bot on public.messages for insert with check (user_id = auth.uid() and from_admin = false and bot_chat = true);
create or replace function public.messages_before_ins() returns trigger language plpgsql set search_path = public as $$
begin
  if new.from_bot then new.bot_chat := true; new.from_admin := false; end if;
  if new.bot_chat then new.seen := true; end if;
  return new;
end $$;
create or replace function public.messages_after_ins() returns trigger language plpgsql security definer set search_path = public as $$
begin
  if new.from_admin and not new.from_bot then
    insert into public.support_threads (user_id, mode, needs_human, updated_at) values (new.user_id, 'human', false, now())
      on conflict (user_id) do update set mode = 'human', needs_human = false, updated_at = now();
  elsif not new.from_admin and not new.bot_chat then
    update public.support_threads set updated_at = now() where user_id = new.user_id and mode = 'human';
  end if;
  return new;
exception when others then return new;
end $$;
drop trigger if exists messages_before_ins on public.messages;
create trigger messages_before_ins before insert on public.messages for each row execute function public.messages_before_ins();
drop trigger if exists messages_after_ins on public.messages;
create trigger messages_after_ins after insert on public.messages for each row execute function public.messages_after_ins();
create or replace function public.support_ask_human() returns void language plpgsql security definer set search_path = public as $$
declare uid uuid := auth.uid(); t record;
begin
  if uid is null then raise exception 'Connexion requise.'; end if;
  select * into t from public.support_threads where user_id = uid;
  insert into public.support_threads (user_id, mode, needs_human, updated_at) values (uid, 'human', true, now())
    on conflict (user_id) do update set mode = 'human', needs_human = true, updated_at = now();
  if not found or t.user_id is null or not t.needs_human or t.updated_at < now() - interval '10 minutes' then
    insert into public.messages (user_id, from_admin, body) values (uid, false, '🙋 Je souhaite parler à la boutique.');
  end if;
end $$;
create or replace function public.support_take(p_uid uuid) returns void language plpgsql security definer set search_path = public as $$
begin
  if not public.is_admin() then raise exception 'Administrateur requis.'; end if;
  insert into public.support_threads (user_id, mode, needs_human, updated_at) values (p_uid, 'human', false, now())
    on conflict (user_id) do update set mode = 'human', needs_human = false, updated_at = now();
end $$;
create or replace function public.support_release(p_uid uuid) returns void language plpgsql security definer set search_path = public as $$
begin
  if not public.is_admin() then raise exception 'Administrateur requis.'; end if;
  insert into public.support_threads (user_id, mode, needs_human, updated_at) values (p_uid, 'bot', false, now())
    on conflict (user_id) do update set mode = 'bot', needs_human = false, updated_at = now();
  insert into public.messages (user_id, from_bot, bot_chat, body)
    values (p_uid, true, true, '🤖 L’assistant reprend la conversation. Posez-moi vos questions, ou touchez « Parler à la boutique » si vous préférez un conseiller.');
end $$;
revoke all on function public.support_ask_human() from public, anon;

revoke all on function public.support_release(uuid) from public, anon;
grant execute on function public.support_ask_human() to authenticated;
grant execute on function public.support_take(uuid) to authenticated;

const PNSW="/* Service worker des notifications : généré par l’administration du site */\nvar ICON='__ICON__';\nself.addEventListener('install',function(){self.skipWaiting()});\nself.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});\nself.addEventListener('push',function(e){\n  var d={};\n  try{d=e.data?e.data.json():{}}catch(x){d={t:'Notification',b:e.data?e.data.text():''}}\n  var o={body:d.b||'',data:{u:d.u||''},lang:'fr'};\n  if(ICON)o.icon=ICON;\n  if(d.i)o.image=d.i;\n  if(d.g){o.tag=d.g;o.renotify=true}\n  e.waitUntil(self.registration.showNotification((d.t||'').trim(),o).then(function(){\n    try{if(self.navigator.setAppBadge)self.navigator.setAppBadge()}catch(x){}\n    return self.clients.matchAll({type:'window',includeUncontrolled:true}).then(function(L){\n      L.forEach(function(c){try{c.postMessage({k:'push',d:d})}catch(x){}})\n    })\n  }));\n});\nself.addEventListener('notificationclick',function(e){\n  e.notification.close();\n  var u=(e.notification.data||{}).u||'',base=self.registration.scope;\n  e.waitUntil(self.clients.matchAll({type:'window',includeUncontrolled:true}).then(function(L){\n    for(var i=0;i<L.length;i++){\n      if(L[i].url.indexOf(base)===0){\n        try{L[i].postMessage({k:'go',u:u})}catch(x){}\n        return L[i].focus?L[i].focus():undefined;\n      }\n    }\n    return self.clients.openWindow(base+u);\n  }));\n});\n",PNFN="// Fonction Supabase « push » : envoie les notifications de la boutique (Web Push).\n// Secrets à créer : VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT.\nconst SU = Deno.env.get(\"SUPABASE_URL\")!;\nconst SK = Deno.env.get(\"SUPABASE_SERVICE_ROLE_KEY\")!;\nconst VPUB = Deno.env.get(\"VAPID_PUBLIC_KEY\") || \"\";\nconst VPRIV = Deno.env.get(\"VAPID_PRIVATE_KEY\") || \"\";\nconst VSUB = Deno.env.get(\"VAPID_SUBJECT\") || \"mailto:contact@example.com\";\nconst CORS = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"authorization, x-client-info, apikey, content-type\",\n  \"Access-Control-Allow-Methods\": \"POST, OPTIONS\",\n};\nconst J = (o: unknown, s = 200) =>\n  new Response(JSON.stringify(o), { status: s, headers: { ...CORS, \"Content-Type\": \"application/json\" } });\n\n/* ---------- Chiffrement Web Push (RFC 8291) et signature VAPID (RFC 8292) ---------- */\nconst te = new TextEncoder();\nconst b64u = (b: ArrayBuffer | Uint8Array) => {\n  let s = \"\";\n  for (const c of new Uint8Array(b)) s += String.fromCharCode(c);\n  return btoa(s).replace(/\\+/g, \"-\").replace(/\\//g, \"_\").replace(/=+$/, \"\");\n};\nconst unb64u = (s: string) => {\n  s = s.replace(/-/g, \"+\").replace(/_/g, \"/\");\n  while (s.length % 4) s += \"=\";\n  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));\n};\nconst cat = (...a: Uint8Array[]) => {\n  const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0));\n  let i = 0;\n  for (const x of a) { o.set(x, i); i += x.length; }\n  return o;\n};\nconst hkdf = async (salt: Uint8Array, ikm: Uint8Array, info: Uint8Array, len: number) =>\n  new Uint8Array(await crypto.subtle.deriveBits(\n    { name: \"HKDF\", hash: \"SHA-256\", salt, info },\n    await crypto.subtle.importKey(\"raw\", ikm, \"HKDF\", false, [\"deriveBits\"]),\n    len * 8,\n  ));\n\nasync function encrypt(p256dh: string, auth: string, data: Uint8Array, eph?: CryptoKeyPair, salt?: Uint8Array) {\n  const ua = unb64u(p256dh), au = unb64u(auth);\n  const kp = eph || (await crypto.subtle.generateKey({ name: \"ECDH\", namedCurve: \"P-256\" }, true, [\"deriveBits\"]));\n  const asPub = new Uint8Array(await crypto.subtle.exportKey(\"raw\", kp.publicKey));\n  const uaKey = await crypto.subtle.importKey(\"raw\", ua, { name: \"ECDH\", namedCurve: \"P-256\" }, false, []);\n  const secret = new Uint8Array(await crypto.subtle.deriveBits({ name: \"ECDH\", public: uaKey }, kp.privateKey, 256));\n  const ikm = await hkdf(au, secret, cat(te.encode(\"WebPush: info\\0\"), ua, asPub), 32);\n  const sl = salt || crypto.getRandomValues(new Uint8Array(16));\n  const cek = await hkdf(sl, ikm, te.encode(\"Content-Encoding: aes128gcm\\0\"), 16);\n  const nonce = await hkdf(sl, ikm, te.encode(\"Content-Encoding: nonce\\0\"), 12);\n  const key = await crypto.subtle.importKey(\"raw\", cek, \"AES-GCM\", false, [\"encrypt\"]);\n  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: \"AES-GCM\", iv: nonce }, key, cat(data, new Uint8Array([2]))));\n  return cat(sl, new Uint8Array([0, 0, 16, 0, 65]), asPub, ct);\n}\n\nasync function vapid(endpoint: string) {\n  const h = b64u(te.encode(JSON.stringify({ typ: \"JWT\", alg: \"ES256\" })));\n  const c = b64u(te.encode(JSON.stringify({\n    aud: new URL(endpoint).origin,\n    exp: Math.floor(Date.now() / 1000) + 12 * 3600,\n    sub: VSUB,\n  })));\n  const pub = unb64u(VPUB);\n  const key = await crypto.subtle.importKey(\n    \"jwk\",\n    { kty: \"EC\", crv: \"P-256\", x: b64u(pub.slice(1, 33)), y: b64u(pub.slice(33, 65)), d: VPRIV, ext: true },\n    { name: \"ECDSA\", namedCurve: \"P-256\" },\n    false,\n    [\"sign\"],\n  );\n  const sig = await crypto.subtle.sign({ name: \"ECDSA\", hash: \"SHA-256\" }, key, te.encode(h + \".\" + c));\n  return `vapid t=${h}.${c}.${b64u(sig)}, k=${VPUB}`;\n}\n\n/* ---------- Base de données (clé service : jamais visible côté client) ---------- */\nconst db = (path: string, init: RequestInit = {}) =>\n  fetch(`${SU}/rest/v1/${path}`, {\n    ...init,\n    headers: {\n      apikey: SK,\n      Authorization: `Bearer ${SK}`,\n      \"Content-Type\": \"application/json\",\n      ...((init.headers as Record<string, string>) || {}),\n    },\n  });\n\nasync function who(req: Request) {\n  const t = (req.headers.get(\"authorization\") || \"\").replace(/^Bearer\\s+/i, \"\");\n  if (!t) return null;\n  const r = await fetch(`${SU}/auth/v1/user`, { headers: { apikey: SK, Authorization: `Bearer ${t}` } });\n  if (!r.ok) return null;\n  const u = await r.json();\n  if (!u?.id) return null;\n  const p = await (await db(`profiles?select=name,is_admin&id=eq.${u.id}`)).json();\n  return { id: String(u.id), name: String(p?.[0]?.name || \"\"), admin: !!p?.[0]?.is_admin };\n}\n\n// Une seule exécution par clé (évite les doublons de notification)\nasync function once(k: string) {\n  const r = await db(\"push_log?on_conflict=k\", {\n    method: \"POST\",\n    headers: { Prefer: \"resolution=ignore-duplicates,return=representation\" },\n    body: JSON.stringify({ k }),\n  });\n  if (Math.random() < 0.02) {\n    db(\"push_log?ts=lt.\" + encodeURIComponent(new Date(Date.now() - 3 * 864e5).toISOString()), { method: \"DELETE\" });\n  }\n  const j = await r.json().catch(() => []);\n  return Array.isArray(j) && j.length > 0;\n}\n\n// Seuls les vrais services de notification des navigateurs sont acceptés\nconst OK_ENDPOINT =\n  /^https:\\/\\/(fcm\\.googleapis\\.com|[a-z0-9.-]+\\.push\\.services\\.mozilla\\.com|web\\.push\\.apple\\.com|[a-z0-9.-]+\\.notify\\.windows\\.com)\\//;\n\ntype Sub = { endpoint: string; p256dh: string; auth: string };\n\nasync function sendAll(subs: Sub[], payload: object) {\n  const data = te.encode(JSON.stringify(payload));\n  let sent = 0, fail = 0;\n  const gone: string[] = [];\n  for (let i = 0; i < subs.length; i += 15) {\n    await Promise.all(subs.slice(i, i + 15).map(async (s) => {\n      try {\n        const r = await fetch(s.endpoint, {\n          method: \"POST\",\n          headers: {\n            Authorization: await vapid(s.endpoint),\n            \"Content-Encoding\": \"aes128gcm\",\n            \"Content-Type\": \"application/octet-stream\",\n            TTL: \"86400\",\n            Urgency: \"high\",\n          },\n          body: await encrypt(s.p256dh, s.auth, data),\n        });\n        if (r.status === 404 || r.status === 410) gone.push(s.endpoint);\n        else if (r.ok) sent++;\n        else fail++;\n        await r.body?.cancel();\n      } catch { fail++; }\n    }));\n  }\n  for (const e of gone) await db(\"push_subs?endpoint=eq.\" + encodeURIComponent(e), { method: \"DELETE\" });\n  return { sent, fail, removed: gone.length };\n}\n\nconst subsOf = async (filter: string): Promise<Sub[]> =>\n  await (await db(\"push_subs?select=endpoint,p256dh,auth\" + filter)).json();\nconst pl = (t: unknown, b: unknown, u: unknown, g?: unknown, i?: unknown) => ({\n  t: String(t || \"\").slice(0, 80),\n  b: String(b || \"\").slice(0, 160),\n  u: /^#[\\w-]{0,60}$/.test(String(u || \"\")) ? String(u) : \"\",\n  g: g ? String(g).slice(0, 40) : undefined,\n  i: /^https:\\/\\/[^\\s\"'<>]{4,300}$/.test(String(i || \"\")) ? String(i) : undefined,\n});\nconst clean = (s: unknown) => String(s || \"\").replace(/[^\\w-]/g, \"\").slice(0, 40);\n\nDeno.serve(async (req) => {\n  if (req.method === \"OPTIONS\") return new Response(\"ok\", { headers: CORS });\n  try {\n    const b = await req.json().catch(() => ({}));\n    const a = String(b.a || \"\");\n    const u = await who(req);\n    const needAdmin = () => (u?.admin ? null : J({ ok: false, error: \"Compte administrateur requis.\" }, 403));\n\n    if (a === \"ping\") {\n      const t1 = await db(\"push_subs?select=endpoint&limit=1\");\n      const t2 = await db(\"push_log?select=k&limit=1\");\n      await t1.body?.cancel(); await t2.body?.cancel();\n      return J({\n        ok: true,\n        vapid: !!(VPUB && VPRIV),\n        vk: VPUB,\n        nv: 2,\n        tables: t1.ok && t2.ok,\n        role: u ? (u.admin ? \"admin\" : \"client\") : \"anon\",\n        subs: u?.admin && t1.ok ? (await subsOf(\"\")).length : undefined,\n      });\n    }\n\n    if (a === \"sub\") {\n      const s = b.sub || {}, k = s.keys || {}, ep = String(s.endpoint || \"\");\n      if (!OK_ENDPOINT.test(ep) || unb64u(String(k.p256dh || \"\")).length !== 65 || unb64u(String(k.auth || \"\")).length < 16) {\n        return J({ ok: false, error: \"Abonnement invalide.\" }, 400);\n      }\n      const r = await db(\"push_subs?on_conflict=endpoint\", {\n        method: \"POST\",\n        headers: { Prefer: \"resolution=merge-duplicates,return=minimal\" },\n        body: JSON.stringify({\n          endpoint: ep, p256dh: k.p256dh, auth: k.auth,\n          user_id: u?.id || null, is_admin: !!u?.admin, ua: String(b.ua || \"\").slice(0, 120),\n        }),\n      });\n      return J({ ok: r.ok, role: u ? (u.admin ? \"admin\" : \"client\") : \"anon\" }, r.ok ? 200 : 500);\n    }\n\n    if (a === \"unsub\") {\n      await db(\"push_subs?endpoint=eq.\" + encodeURIComponent(String(b.endpoint || \"\")), { method: \"DELETE\" });\n      return J({ ok: true });\n    }\n\n    if (a === \"test\") {\n      if (!u) return J({ ok: false, error: \"Connexion requise.\" }, 401);\n      return J({ ok: true, ...(await sendAll(await subsOf(\"&user_id=eq.\" + u.id), pl(\"🔔 Notifications actives\", \"Test réussi : vous recevrez ici les messages et les actualités.\", \"\"))) });\n    }\n\n    if (a === \"send\") {\n      const no = needAdmin(); if (no) return no;\n      const f = b.aud === \"members\" ? \"&user_id=not.is.null\" : \"\";\n      return J({ ok: true, ...(await sendAll(await subsOf(f), pl(b.t, b.d, b.u, b.g, b.i))) });\n    }\n\n    if (a === \"news\") {\n      const no = needAdmin(); if (no) return no;\n      const id = clean(b.id);\n      if (!b.force && !(await once(\"n:\" + id))) return J({ ok: true, dup: true });\n      const f = b.pub ? \"\" : \"&user_id=not.is.null\";\n      return J({ ok: true, ...(await sendAll(await subsOf(f), pl(\"📰 \" + (b.t || \"Nouvelle actualité\"), b.d || \"Touchez pour la découvrir.\", \"#actu-\" + id, \"news-\" + id, b.i))) });\n    }\n\n    if (a === \"msg_admin\") {\n      if (!u) return J({ ok: false, error: \"Connexion requise.\" }, 401);\n      const mid = Number(b.mid) || 0;\n      const m = (await (await db(`messages?select=id,user_id,from_admin,body,created_at&id=eq.${mid}`)).json())?.[0];\n      if (!m || m.user_id !== u.id || m.from_admin || Date.now() - Date.parse(m.created_at) > 3e5) {\n        return J({ ok: false, error: \"Message introuvable.\" }, 403);\n      }\n      if (!(await once(\"m:\" + mid)) || !(await once(`u:${u.id}:${Math.floor(Date.now() / 2e4)}`))) return J({ ok: true, dup: true });\n      return J({ ok: true, ...(await sendAll(await subsOf(\"&is_admin=eq.true\"), pl(\"💬 \" + (u.name || \"Un client\"), m.body, \"#adm-msg-\" + u.id, \"msg-\" + u.id))) });\n    }\n\n    if (a === \"msg_client\") {\n      const no = needAdmin(); if (no) return no;\n      const mid = Number(b.mid) || 0;\n      const m = (await (await db(`messages?select=id,user_id,from_admin,body,created_at&id=eq.${mid}`)).json())?.[0];\n      if (!m || !m.from_admin || Date.now() - Date.parse(m.created_at) > 3e5) return J({ ok: false, error: \"Message introuvable.\" }, 403);\n      if (!(await once(\"m:\" + mid))) return J({ ok: true, dup: true });\n      return J({ ok: true, ...(await sendAll(await subsOf(\"&user_id=eq.\" + m.user_id), pl(String(b.t || \"\").trim().slice(0, 60), m.body, \"#compte-msg\", \"msg\"))) });\n    }\n\n    return J({ ok: false, error: \"Action inconnue.\" }, 400);\n  } catch (e) {\n    return J({ ok: false, error: String((e as Error)?.message || e) }, 500);\n  }\n});\n",PNSQL="-- À lancer UNE fois : Supabase > SQL Editor > New query > Run\ncreate table if not exists public.push_subs (\n  endpoint text primary key,\n  p256dh text not null,\n  auth text not null,\n  user_id uuid references public.profiles(id) on delete cascade,\n  is_admin boolean not null default false,\n  ua text,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists push_subs_user_idx on public.push_subs (user_id);\ncreate index if not exists push_subs_admin_idx on public.push_subs (is_admin) where is_admin;\nalter table public.push_subs enable row level security;\ncreate table if not exists public.push_log (\n  k text primary key,\n  ts timestamptz not null default now()\n);\nalter table public.push_log enable row level security;\n-- Aucune règle d’accès : seule la fonction « push » (clé service) lit et écrit ces   value jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()

alter table public.site_flags enable row level security;

create policy sf_sel on public.site_flags for select to anon, authenticated using (key in ('maint','maint_img'));
drop policy if exists sf_ins on public.site_flags;

drop policy if exists sf_upd on public.site_flags;

create policy sf_del on public.site_flags for delete to authenticated using (exists (select 1 from public.profiles where id = auth.uid() and is_admin));
