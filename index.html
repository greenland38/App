.w:not(.aw)>h2{animation:ul linear backwards;animation-timeline:view();animation-range:entry 10% entry 80%}}
@supports (animation-timeline:scroll()){html::after{content:"";position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:3px;z-index:11;pointer-events:none;background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:0 50%;scale:0 1;animation:spg linear both;animation-timeline:scroll(root)}}
html[data-fx=off] *,html[data-fx=off] ::before,html[data-fx=off] ::after{animation:none!important;transition:none!important}html[data-fx=off]::after{display:none}
/* ---- écran d'accueil ---- */
@keyframes kb{from{scale:.94}to{scale:1}}
@keyframes ssl{from{translate:30% 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes srv{from{clip-path:circle(0% at 50% 60%)}to{clip-path:circle(150% at 50% 60%)}}
@keyframes so{to{opacity:0;scale:1.08;filter:blur(8px)}}
#sp{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:24px 24px calc(40px + env(safe-area-inset-bottom,0px));color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c2) 60%,#000));animation:fd .4s both}
#sp .sbg{position:absolute;inset:-8%;z-index:-3;background:center/cover no-repeat;filter:blur(24px) brightness(.7) saturate(1.15)}
#sp .si{position:absolute;inset:0;z-index:-2;background:center/contain no-repeat}
#sp::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.12) 55%,rgba(0,0,0,.35))}
#sp h1{font-size:clamp(30px,9vw,46px);line-height:1.08;margin:0 0 10px;font-weight:800;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.5)}
#sp p{margin:0 0 22px;font-size:17px;max-width:420px;animation:up .7s .9s both}
#sp .wd{display:inline-block;animation:wd .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--w)*80ms + .5s)}
#sp .b{width:100%;max-width:360px;font-size:17px;padding:15px 18px;background-color:var(--c2);color:var(--c2t,#1B1A18);animation:up .7s 1.2s both,pl 2.2s 2s infinite}
#sp.sp-zoom .si{animation:kb 3.5s cubic-bezier(.16,1,.3,1) both}#sp.sp-fade .si{animation:fd 1.8s both}#sp.sp-slide .si{animation:ssl 1s cubic-bezier(.2,.8,.2,1) both}#sp.sp-rev .si{animation:srv 1.3s cubic-bezier(.7,0,.2,1) both}
#sp.out{animation:so .6s ease-in both;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
/* ---- CORRECTIF : blocage en haut de page (animations allégées) ---- */
.brand b,#ag h2{animation:none;background:none;-webkit-text-fill-color:var(--tx);color:var(--tx)}
.hero::before,.hero .b,.st.on::before,.fab{animation:none}
#sp .b{animation:up .7s 1.2s both}
.w:not(.aw)>h2{animation:none}
.ov{backdrop-filter:none;-webkit-backdrop-filter:none;overscroll-behavior:contain}
.sh{overscroll-behavior:contain}
/* ---- Logo : forme d'origine (plus de rond) ---- */
.brand img{width:auto;height:auto;max-width:min(72vw,280px);max-height:190px;aspect-ratio:auto;object-fit:contain;border:0;border-radius:18px;background:none;box-shadow:none}
/* ---- Relief : bandeau défilant, cartes produits, boutons ---- */
.mq{--mb:color-mix(in srgb,var(--c1) 16%,#141210);position:relative;background:var(--mb);color:#fff;border:1px solid color-mix(in srgb,var(--c1) 70%,transparent);box-shadow:0 8px 22px -8px color-mix(in srgb,var(--c1) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.22);font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin:6px 0 18px}
.mq div{padding:11px 0}
.mq span{padding:0}
.mq span::after{content:"\2726";color:var(--c2);margin:0 22px;text-shadow:0 0 8px var(--c1)}
.mq::before,.mq::after{content:"";position:absolute;top:0;bottom:0;width:44px;z-index:1;pointer-events:none}
.mq::before{left:0;background:linear-gradient(90deg,var(--mb),transparent)}
.mq::after{right:0;background:linear-gradient(270deg,var(--mb),transparent)}
.pc{position:relative;border:1px solid color-mix(in srgb,var(--c1) 45%,var(--ln));border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--cd) 82%,#fff),var(--cd) 55%,color-mix(in srgb,var(--cd) 85%,#000));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 40%,#000),0 16px 24px -12px rgba(0,0,0,.65);transition:transform .25s,box-shadow .25s}
.pc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25)}
.pc .ph{position:relative;box-shadow:inset 0 -26px 30px -18px rgba(0,0,0,.55)}
.pc .ph::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 38%)}
.pc .pi{padding:12px 12px 14px}
.pc .pi>b{display:block;font-weight:800;font-size:16px;line-height:1.2}
.pc .pi .mu{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:99px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 1px rgba(0,0,0,.4);box-shadow:0 4px 10px -3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35)}
@media(hover:hover){.pc:hover{transform:perspective(800px) translateY(-7px) rotateX(3deg);box-shadow:0 8px 0 color-mix(in srgb,var(--c1) 40%,#000),0 26px 34px -14px rgba(0,0,0,.7)}}
.pc:active,.pc:hover:active{transform:perspective(800px) translateY(3px) rotateX(5deg) scale(.985);box-shadow:0 1px 0 color-mix(in srgb,var(--c1) 40%,#000),0 6px 12px -6px rgba(0,0,0,.6)}
.hero{box-shadow:0 18px 34px -16px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.25)}
.inf>div,.g2 .cd,.fq{box-shadow:0 8px 18px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.b:not(.b2):not(:disabled){box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 55%,#000),0 10px 16px -8px rgba(0,0,0,.6)}
.b:not(.b2):not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 color-mix(in srgb,var(--c1) 55%,#000)}
/* ---- Relief partout ---- */
.brand b{text-shadow:0 2px 0 color-mix(in srgb,var(--c1) 60%,#000),0 8px 18px rgba(0,0,0,.45)}
.brand img{filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.hero h1{text-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 22px rgba(0,0,0,.45)}
.w:not(.aw)>h2{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.num{text-shadow:0 2px 0 rgba(0,0,0,.2)}
.ch{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.ch.on{box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 60%,#000),inset 0 1px 0 rgba(255,255,255,.25)}

.b2{box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}

.cd,.tx,.lab,.wn,.bm{box-shadow:0 8px 18px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.pr{box-shadow:0 4px 0 color-mix(in srgb,var(--c2) 55%,#000),0 12px 18px -10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.bm.u{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 65%,#000))}
.nb{background:linear-gradient(145deg,var(--c1),color-mix(in srgb,var(--c1) 60%,#000));box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 40%,#000),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.em2{filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))}
@media(hover:hover){.g2 .cd{transition:transform .25s,box-shadow .25s}.g2 .cd:hover{transform:translateY(-5px);box-shadow:0 18px 26px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.2)}}
input:not([type=checkbox]):not([type=radio]):not([type=color]):not([type=file]),select,textarea{box-shadow:inset 0 2px 5px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.12)}
.sh{border-top:1px solid color-mix(in srgb,var(--c1) 50%,transparent);box-shadow:0 -14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.sh::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--tx) 30%,transparent);margin:8px auto 4px}
.sl>*{box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.ts{box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px color-mix(in srgb,var(--c1) 60%,transparent)}
.aw .bar{box-shadow:0 8px 14px -10px rgba(0,0,0,.6)}
/* ---- Infos et horaires détaillés ---- */
.inf{gap:12px}
.inf>.ib{position:relative;overflow:hidden;padding:12px 14px 12px 18px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--cd) 85%,#fff),var(--cd))}
.inf>.ib::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ih i{font-style:normal;display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:10px;font-size:16px;background:linear-gradient(145deg,var(--c1),color-mix(in srgb,var(--c1) 60%,#000));box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 40%,#000),inset 0 1px 0 rgba(255,255,255,.4)}

.inf .st{display:inline-block;padding:4px 11px;border-radius:99px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(217,45,32,.55);color:color-mix(in srgb,#D92D20 55%,var(--tx))}
.inf .st.on{background:rgba(30,158,87,.2);box-shadow:inset 0 0 0 1px rgba(30,158,87,.7);color:color-mix(in srgb,#1E9E57 55%,var(--tx))}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chp{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(0,0,0,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.1)}
.chp.hot{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4);background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 3px 8px -3px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.hrs{margin:12px 0 4px}
.hrs summary{list-style:none;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;font-weight:700;color:var(--tx);background:var(--cd);border:1px solid var(--ln);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.hrs summary::-webkit-details-marker{display:none}
.hrs summary::after{content:"\25BE";transition:transform .2s}
.hrs[open] summary::after{transform:rotate(180deg)}
.hrs .t3{align-items:center;padding:10px 12px;margin-top:6px;border-radius:12px;font-size:14px;background:var(--cd);box-shadow:0 5px 12px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.hrs .t3 span:first-child{display:flex;flex-direction:column;gap:2px}
.hrs .th3{background:none;box-shadow:none;padding:8px 12px 0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.t3 em{font-style:normal;font-size:11px;font-weight:800;color:var(--c2)}
.hrs .today{background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 35%,var(--cd)),var(--cd));box-shadow:0 0 0 2px var(--c1),0 10px 18px -8px rgba(0,0,0,.6)}
.hrs .off{opacity:.55}
.hrs small{font-size:10px;font-weight:700;color:var(--c2);margin-left:4px}

/* ---- Titres en 3D ---- */
:root{--x3a:color-mix(in srgb,var(--c1) 78%,#000);--x3b:color-mix(in srgb,var(--c1) 55%,#000);--x3c:color-mix(in srgb,var(--c1) 35%,#000);--x3:-1px -1px 0 rgba(255,255,255,.45),0 1px 0 var(--x3a),0 2px 0 var(--x3a),0 3px 0 var(--x3b),0 4px 0 var(--x3b),0 5px 0 var(--x3c),0 6px 5px rgba(0,0,0,.4),0 10px 16px rgba(0,0,0,.35)}
html[data-t3=off]{--x3:none}
.brand b,.w:not(.aw)>h2,.sh h2,.agc h2,#sp h1{text-shadow:var(--x3);letter-spacing:.01em}
.brand b{padding-bottom:8px}
.w:not(.aw)>h2{padding-bottom:9px}
/* ---- Bouton COMMANDER centré (sans bannière) ---- */
.cta{display:flex;justify-content:center;margin:0 0 10px}
.cta .b{min-width:min(100%,280px);padding:16px 34px;font-size:19px;letter-spacing:.05em;border-radius:16px}
body.an .cta{animation:up .6s .1s both}
/* ---- Villes livrées ---- */
.zg{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--cd);box-shadow:0 5px 12px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.zg>b{display:block;margin-bottom:8px;font-size:18px;color:var(--c2)}

/* ---- Typographies secondaires ---- */
:root{--f2:'DM Sans',system-ui,sans-serif;--f3:'Oswald','Bricolage Grotesque',system-ui,sans-serif}
.mu,.sh p,.tx p,.fq p,.ft,.wn,label,input,select,textarea,.bm,.sp .mu,.cd .mu,.chp,.ol,.pk{font-family:var(--f2)}
.sh .mu,.sh p,.tx p,.fq p{line-height:1.65;font-size:15px}
.ih b,.th3 b,.st,.ch,.lt,.ln,.as span,.trk span,.sb{font-family:var(--f3);text-transform:uppercase;letter-spacing:.09em}
.ch{font-size:13px}.tm,.pp,.num,.tt.big{font-family:var(--f3);letter-spacing:.03em}
.pc .pi .mu{font-family:var(--f3);letter-spacing:.04em}
.pc .pi>b{letter-spacing:-.005em}
.sh h3{font-family:var(--f3);text-transform:uppercase;letter-spacing:.1em;font-size:15px;color:var(--c2)}
.fq summary b{font-family:var(--f2);font-weight:700}
/* ---- Espace client & carte de fidélité ---- */
.lc{position:relative;overflow:hidden;border-radius:20px;padding:16px;margin:14px 0;color:#fff;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 50%,#000) 70%,color-mix(in srgb,var(--c2) 55%,#000));box-shadow:0 16px 28px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.lc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%)}
.lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.lt{font-size:13px;opacity:.9}.lb{font-weight:800;font-size:15px;text-align:right;overflow-wrap:anywhere}
.ls{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:8px;margin:14px 0 12px}

.ls i.on{background:linear-gradient(145deg,#fff,var(--c2));color:var(--c1);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 #fff}
.ls i.gf{font-size:19px;border:2px dashed rgba(255,255,255,.6)}.ls i.gf.on{border-color:#fff;background:linear-gradient(145deg,#fff,var(--c2))}
.lf{font-weight:700;line-height:1.3}.ln{font-size:11px;opacity:.85;margin-top:6px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.pk span{padding:10px 12px;border-radius:12px;background:var(--cd);font-size:14px;font-weight:600;box-shadow:0 5px 12px -8px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.ah{display:flex;align-items:center;gap:14px;margin:6px 0 12px}.ah h2{font-size:22px}
.av{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f3);font-size:26px;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 45%,#000),inset 0 1px 0 rgba(255,255,255,.4)}
.as{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.as>div{text-align:center;padding:10px 6px;border-radius:14px;background:var(--cd);box-shadow:0 6px 14px -9px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.as b{display:block;font-size:18px;font-weight:800;color:var(--c2)}.as span{font-size:10px;color:var(--mu)}
.oc{margin:10px 0;padding:12px 14px;border-radius:16px;background:var(--cd);border-left:4px solid var(--c1);box-shadow:0 8px 18px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12)}
.trk{display:flex;justify-content:space-between;margin:10px 0}.trk span{flex:1;text-align:center;font-size:10px;color:var(--mu)}.trk i{display:grid;place-items:center;margin:0 auto 4px;width:24px;height:24px;border-radius:50%;font-style:normal;font-weight:800;font-size:12px;background:rgba(0,0,0,.3)}
.trk span.on{color:var(--tx)}.trk span.on i{background:#1E9E57;color:#fff}
.sb{display:inline-block;margin:8px 0;padding:4px 12px;border-radius:99px;font-size:11px;background:rgba(217,45,32,.25);color:#ff8a80}
.ol{margin:6px 0 10px;padding-left:18px;font-size:14px}

/* ---- Carte à points ---- */
.lp{display:flex;align-items:baseline;gap:8px;margin:10px 0 6px}.lp b{font-family:var(--f3);font-size:46px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.35)}.lp span{font-family:var(--f3);text-transform:uppercase;letter-spacing:.12em;font-size:13px;opacity:.85}
.bar2{height:12px;border-radius:99px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.5);overflow:hidden}.bar2 i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#fff,var(--c2));box-shadow:0 0 10px rgba(255,255,255,.6)}
.lc .lf{margin-top:10px}.lr{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.lr span{display:flex;flex-direction:column;padding:7px 12px;border-radius:12px;font-weight:700;font-size:14px;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.18);opacity:.75}.lr span small{font-family:var(--f3);letter-spacing:.08em;font-size:11px;opacity:.85}.lr span.on{opacity:1;background:linear-gradient(145deg,#fff,var(--c2));color:var(--c1);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 #fff}
.lw{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--cd);border:1px solid var(--ln)}
/* ---- Fiche produit ---- */
.cat{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:99px;font-family:var(--f3);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 3px 0 color-mix(in srgb,var(--c1) 45%,#000),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.sh .pd{margin:8px 0 12px;padding:12px 14px;border-radius:14px;border-left:4px solid var(--c2);background:rgba(0,0,0,.2);box-shadow:inset 0 2px 6px rgba(0,0,0,.3);font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:17px;line-height:1.75;white-space:pre-line;color:var(--tx)}
.ef{margin:8px 0;font-family:var(--f2)}.ef span{display:inline-block;margin-right:8px;padding:2px 10px;border-radius:99px;font-family:var(--f3);text-transform:uppercase;letter-spacing:.1em;font-size:12px;background:var(--c2);color:var(--c2t,#1B1A18)}
.sh .pp{display:inline-block;margin:8px 0;padding:6px 16px;border-radius:12px;font-family:var(--f3);font-size:28px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 0 color-mix(in srgb,var(--c1) 45%,#000),0 12px 18px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sh label.ck{padding:10px 12px;margin:8px 0;border-radius:12px;background:var(--cd);font-family:var(--f2);font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.tx p,.fq p,.g2 .mu,.sp .mu{font-family:'Fraunces',Georgia,serif;font-style:italic;line-height:1.65}

@keyframes csbVert{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 transparent}50%{box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 13px color-mix(in srgb,var(--c1) 90%,transparent)}}

.pc.fxe::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 35%,color-mix(in srgb,var(--c2) 38%,transparent) 50%,transparent 65%);transform:translateX(-100%);animation:pcSweep 4.5s ease-in-out infinite}
@keyframes pcSweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* étiquettes qui bougent : va-et-vient, avant / arrière */
.pbd .csb.bsl{animation:csbOr 1.8s ease-in-out infinite}
@keyframes csbOr{0%,100%{transform:translateX(0);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 transparent}50%{transform:translateX(7px);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 14px color-mix(in srgb,var(--c2) 90%,transparent)}}
.pbd .csb.exb{animation:csbGold 2s ease-in-out infinite}
@keyframes csbGold{0%,100%{transform:scale(1) rotate(0);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 6px color-mix(in srgb,var(--c2) 45%,transparent)}25%{transform:scale(1.12) rotate(-2deg)}50%{transform:scale(1.12) rotate(0);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 16px color-mix(in srgb,var(--c2) 95%,transparent)}75%{transform:scale(1.12) rotate(2deg)}}
.pbd .csb.nwb{animation:csbVert 1.6s ease-in-out infinite}
@keyframes csbVert{0%,100%{transform:translateY(0);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 0 transparent}50%{transform:translateY(-4px);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 13px color-mix(in srgb,var(--c1) 90%,transparent)}}
.pbd .csb.low{animation:csbFeu 1.1s ease-in-out infinite}
@keyframes csbFeu{0%,100%{transform:translateX(0) scale(1);box-shadow:0 0 0 rgba(255,120,0,0)}25%{transform:translateX(-3px) scale(1.06)}50%{transform:translateX(0) scale(1.1);box-shadow:0 0 12px rgba(255,120,0,.9)}75%{transform:translateX(3px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.pc.fxb,.pc.fxe,.pc.fxe::before{animation:none!important}}

/* même effet que l’étiquette Exclusivité (zoom + léger balancement + halo) sur les autres étiquettes */
@keyframes csbPop{0%,100%{transform:scale(1) rotate(0);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 6px color-mix(in srgb,var(--g) 45%,transparent)}25%{transform:scale(1.12) rotate(-2deg)}50%{transform:scale(1.12) rotate(0);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 16px color-mix(in srgb,var(--g) 95%,transparent)}75%{transform:scale(1.12) rotate(2deg)}}
.pbd .csb.bsl,.pbd .csb.nwb,.pbd .csb.low,.pbd .csb.soo,.pbd .csb.scb{--g:var(--c2);animation:csbPop 2s ease-in-out infinite}

.pbd .csb.soo::after,.pbd .csb.scb::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:csbShine 3s ease-in-out infinite;pointer-events:none}
@media (prefers-reduced-motion:reduce){.pbd .csb.bsl,.pbd .csb.nwb,.pbd .csb.low,.pbd .csb.soo,.pbd .csb.scb,.pbd .csb.soo::after,.pbd .csb.scb::after{animation:none!important}}

/* ===== REFONTE NÉON v43 ===== */
/* ================================================================
   REFONTE NÉON v43 — vert flash / noir / blanc
   Couche de style ajoutée à la fin : aucune logique JS modifiée.
   Couleur d'accent = --c1 (réglable dans l'admin). Tout le reste est noir & blanc.
   ================================================================ */
:root{
  --bg:#040704!important;--cd:#0b110b!important;--tx:#fff!important;--mu:#a9bbaa!important;--ln:rgba(255,255,255,.14)!important;
  --c2:#fff!important;--c2t:#04140a!important;--ht:#fff!important;color-scheme:dark!important;
  --nk:rgba(8,12,8,.86);--nk2:rgba(16,24,16,.94);
  --ng:color-mix(in srgb,var(--c1) 62%,transparent);
  --nb:color-mix(in srgb,var(--c1) 40%,transparent);
  --nt:var(--c1t,#03100a);
  --x3:0 0 20px color-mix(in srgb,var(--c1) 45%,transparent);
  --rl-bd:color-mix(in srgb,var(--c1) 38%,transparent);--rl-sheen:none;--rl-edge:transparent;
  --rl-sh:0 10px 24px -16px rgba(0,0,0,.9);
  --rl-sh-h:0 0 0 1px var(--c1),0 0 28px -8px color-mix(in srgb,var(--c1) 62%,transparent)
}
html{background:#040704;scrollbar-color:var(--c1) #040704}
body{background:transparent}
body::after{
  background:radial-gradient(120% 55% at 50% -8%,color-mix(in srgb,var(--c1) 26%,transparent),transparent 62%),
             linear-gradient(180deg,rgba(0,10,0,.10),rgba(0,0,0,.38)),
             var(--bgi,none) center/cover;
  filter:blur(3px) brightness(.72) saturate(1.15);transform:scale(1.06)}
::selection{background:var(--c1);color:#03100a}
@supports (animation-timeline:scroll()){html::after{background:var(--c1);box-shadow:0 0 12px var(--c1)}}
@keyframes pcGlow{
  0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c1) 55%,transparent),0 0 10px -2px color-mix(in srgb,var(--c1) 50%,transparent)}
  50%{box-shadow:0 0 0 1px var(--c1),0 0 26px -2px color-mix(in srgb,var(--c1) 80%,transparent)}}

/* ---------- Boutons ---------- */

/* ===== ANIMATIONS NÉON v44 ===== */
/* ================================================================
   ANIMATIONS NÉON v44
   - On n'anime QUE transform / opacité : fluide sur iPhone, rien de lourd
     (pas de flou, d'ombre ou de dégradé animés en continu).
   - Chargement : une seule fois (body.an). Défilement : animations liées au scroll.
   - Les animations en boucle restent synchronisées d'un affichage à l'autre (--t).
   - Tout est coupé si « Effets animés » est désactivé (admin) ou si le téléphone
     est en « Réduire les animations ».
   ================================================================ */
@keyframes nDrop{from{opacity:0;translate:0 -26px}to{opacity:1;translate:0 0}}
@keyframes nLogo{0%{opacity:0;scale:.45;rotate:-9deg}55%{opacity:1;scale:1.1;rotate:2deg}78%{scale:.97;rotate:-1deg}100%{opacity:1;scale:1;rotate:0deg}}
@keyframes nBand{from{opacity:0;scale:.35 1}to{opacity:1;scale:1 1}}
@keyframes nBtn{0%{opacity:0;translate:0 28px;scale:.88}60%{opacity:1;scale:1.04}100%{opacity:1;translate:0 0;scale:1}}
@keyframes nL{from{opacity:0;translate:-14px 18px;scale:.92}to{opacity:1;translate:0 0;scale:1}}
@keyframes nR{from{opacity:0;translate:14px 18px;scale:.92}to{opacity:1;translate:0 0;scale:1}}
@keyframes nUp{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}
@keyframes nIn{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
@keyframes nFi{from{opacity:0}to{opacity:1}}
@keyframes nCard{0%{opacity:0;translate:0 38px;scale:.88}100%{opacity:1;translate:0 0;scale:1}}
@keyframes nRL{from{opacity:0;translate:-14px 32px;scale:.92;rotate:-2deg}to{opacity:1;translate:0 0;scale:1;rotate:0deg}}
@keyframes nRR{from{opacity:0;translate:14px 32px;scale:.92;rotate:2deg}to{opacity:1;translate:0 0;scale:1;rotate:0deg}}
@keyframes nPop{0%{opacity:0;scale:.5}60%{opacity:1;scale:1.14}100%{opacity:1;scale:1}}
@keyframes nTitle{from{opacity:0;translate:-30px 0}to{opacity:1;translate:0 0}}
@keyframes nBar{from{opacity:0;scale:1 0}to{opacity:1;scale:1 1}}
@keyframes nNeon{0%,16%{opacity:0}20%{opacity:1}24%{opacity:.1}30%{opacity:.9}36%{opacity:.25}44%,100%{opacity:1}}
/* ambiance : boucles courtes, sur de très petits éléments, durées qui divisent 60 s */
@keyframes nHalo{0%,100%{opacity:.5;scale:.92}50%{opacity:1;scale:1.08}}
@keyframes nGlow{0%,100%{opacity:.22}50%{opacity:.85}}
@keyframes nShine{0%,58%{translate:-140% 0}100%{translate:430% 0}}
@keyframes nDot{0%,100%{opacity:1;scale:1}50%{opacity:.35;scale:.7}}
@keyframes nTap{from{opacity:.95;scale:.35}to{opacity:0;scale:2.7}}

/* Filet de sécurité : un bloc qui arrive de côté ne doit jamais élargir la page */
:root .w:not(.aw){overflow-x:clip}

/* ---------- 1. Logo qui s'allume comme un néon ---------- */
:root .brand{position:relative;isolation:isolate}
:root .brand::before{content:"";position:absolute;left:50%;top:50%;width:min(88vw,380px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--c1) 42%,transparent),color-mix(in srgb,var(--c1) 12%,transparent) 55%,transparent);animation:nHalo 4s var(--t,0s) ease-in-out infinite}

/* ---------- 2. Bouton COMMANDER : halo qui bat + éclat qui traverse ---------- */
:root .cta{position:relative;isolation:isolate}
:root .cta::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:min(100%,360px);translate:-50% 0;border-radius:16px;z-index:-1;pointer-events:none;box-shadow:0 0 36px 6px var(--c1);animation:nGlow 2.5s var(--t,0s) ease-in-out infinite}
:root .cta .b{position:relative;overflow:hidden}
:root .cta .b::after,:root .sh .pfx>.b::after,:root .sh .cok::after{content:"";position:absolute;top:0;bottom:0;left:0;width:36%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:nShine 5s var(--t,0s) ease-in-out infinite}
:root .sh .pfx>.b,:root .sh .cok{position:relative;overflow:hidden}

/* ---------- 3. « Ouvert maintenant » : le point respire ---------- */
:root .st.on::before{background:var(--c1);box-shadow:0 0 8px var(--c1);animation:nDot 2s var(--t,0s) ease-in-out infinite}

/* ---------- 4. Produits « best seller » / « exclusif » : lueur qui pulse (sans repeindre la carte) ---------- */
:root .pc.fxb,:root .pc.fxe{animation:none;box-shadow:0 0 0 1px var(--c1),0 0 24px -6px var(--c1),0 14px 26px -18px rgba(0,0,0,.95)}
:root .pc.fxb::after,:root .pc.fxe::after{box-shadow:inset 0 0 0 1px var(--c1),inset 0 0 26px -2px color-mix(in srgb,var(--c1) 70%,transparent);animation:nGlow 2.5s var(--t,0s) ease-in-out infinite}

/* ---------- 5. Chargement de la page (une seule fois) ---------- */
:root body.an .w:not(.aw) .bar>*{animation:nDrop .55s cubic-bezier(.2,.9,.3,1.15) both}
:root body.an .w:not(.aw) .bar>:nth-child(2){animation-delay:.07s}
:root body.an .w:not(.aw) .bar>:nth-child(3){animation-delay:.14s}
:root body.an .brand img,:root body.an .brand .em{animation:nLogo 1s .1s cubic-bezier(.2,.9,.3,1) both,fl 4s var(--t,0s) ease-in-out infinite}
:root body.an .brand::before{animation:nHalo 4s var(--t,0s) ease-in-out infinite,nNeon 1.3s .3s backwards}
:root body.an .mq{animation:nBand .8s .5s cubic-bezier(.2,.8,.2,1) both}
:root body.an .cta{animation:none}
:root body.an .cta .b{animation:nBtn .75s .75s cubic-bezier(.2,.9,.3,1.15) both}
:root body.an .cta::before{animation:nGlow 2.5s var(--t,0s) ease-in-out infinite,nFi .6s .9s backwards}
:root body.an .w:not(.aw)>h2:first-of-type{animation:nTitle .6s .95s cubic-bezier(.2,.8,.2,1) both}
:root body.an .w:not(.aw)>h2:first-of-type::before{animation:nBar .5s 1.05s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 100%}
:root body.an .inf{animation:none}
:root body.an .w:not(.aw) .inf>.ib:nth-child(1){animation:nL .7s 1.1s cubic-bezier(.2,.9,.3,1.1) both}
:root body.an .w:not(.aw) .inf>.ib:nth-child(2){animation:nR .7s 1.2s cubic-bezier(.2,.9,.3,1.1) both}
:root body.an .hrs{animation:nUp .5s 1.35s both}
/* changement de catégorie : les cartes arrivent l'une après l'autre */
:root body.ac .w:not(.aw) .g .pc:nth-child(n){animation:nCard .65s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:calc(var(--i,0)*80ms)}

/* ---------- 6. Au défilement : chaque bloc arrive de son côté ---------- */
@supports (animation-timeline:view()){
:root .w:not(.aw) :is(.g .pc,.g2 .cd,.inf>.ib):nth-child(odd){animation:nRL linear backwards;animation-timeline:view();animation-range:entry 0% entry 55%}
:root .w:not(.aw) :is(.g .pc,.g2 .cd,.inf>.ib):nth-child(even){animation:nRR linear backwards;animation-timeline:view();animation-range:entry 0% entry 55%}
:root .w:not(.aw)>h2{animation:nTitle linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
:root .w:not(.aw)>h2::before{animation:nBar linear both;animation-timeline:view();animation-range:entry 0% entry 80%;transform-origin:50% 100%}
}

/* ---------- 7. Ouvertures : horaires, questions, fenêtres ---------- */
:root .hrs[open]>.t3{animation:nIn .4s cubic-bezier(.2,.8,.2,1) both}
:root .hrs[open]>.t3:nth-child(3){animation-delay:.04s}
:root .hrs[open]>.t3:nth-child(4){animation-delay:.08s}
:root .hrs[open]>.t3:nth-child(5){animation-delay:.12s}
:root .hrs[open]>.t3:nth-child(6){animation-delay:.16s}
:root .hrs[open]>.t3:nth-child(7){animation-delay:.2s}
:root .hrs[open]>.t3:nth-child(8){animation-delay:.24s}
:root .hrs[open]>.t3:nth-child(9){animation-delay:.28s}
:root .fq[open]>:not(summary){animation:nIn .4s both}
:root #m.op .sh .pp{animation:nPop .6s .3s cubic-bezier(.2,1.5,.4,1) both}

/* ---------- 8. Retours au toucher ---------- */
:root input,:root select,:root textarea{transition:border-color .2s,box-shadow .25s}
:root .ch{transition:background .25s,color .25s,border-color .25s,box-shadow .25s,transform .15s}
.tpr{position:fixed;z-index:300;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;pointer-events:none;border:2px solid var(--c1);box-shadow:0 0 16px var(--c1),inset 0 0 12px color-mix(in srgb,var(--c1) 70%,transparent);animation:nTap .55s cubic-bezier(.2,.7,.3,1) forwards}
.fly{position:fixed;left:0;top:0;z-index:310;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#fff,var(--c1) 55%);box-shadow:0 0 18px 4px var(--c1)}

.zsv{margin:-4px 0 12px 14px;padding:8px 0 2px 12px;border-left:2px solid rgba(128,128,128,.35);display:grid;gap:8px}
.zsv .chs{gap:6px}
.zsv .chp{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px}
.zsx{all:unset;cursor:pointer;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;opacity:.75;background:rgba(128,128,128,.25)}
.zsx:active{opacity:1}
.zsa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.zsa input{flex:1 1 180px;margin:0}
.chg{display:inline-flex;flex-direction:column;align-items:flex-start;gap:6px}
.chg.on{flex:1 1 100%}
.chb{font:inherit;font-size:13px;font-weight:600;color:inherit;cursor:pointer;text-align:left}
.chb small{opacity:.75;font-weight:700}
.chs2{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px 12px;border-left:2px solid rgba(128,128,128,.35)}
.chs2[hidden]{display:none}
.chs2 .chp{font-size:12px;padding:4px 10px;opacity:.95}
html[data-fx=on] .pc.pre{opacity:0;transform:translateY(16px)}
html[data-fx=on] .pc.pre.rv{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*60ms)}
html[data-fx=on] .bdg{position:relative;overflow:hidden}
html[data-fx=on] .bdg::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:bshine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes bshine{60%,100%{transform:translateX(120%)}}
.st::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:#D92D20;vertical-align:middle}
.st.on::before{background:#1E9E57;animation:pls 1.6s ease-out infinite}
html[data-fx=off] .st.on::before{animation:none}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(30,158,87,.65)}100%{box-shadow:0 0 0 8px rgba(30,158,87,0)}}
.fdb{margin:0 0 12px;padding:10px 12px;border:1px solid var(--ln);border-radius:14px;background:rgba(128,128,128,.08);font-size:14px}
.fdt{display:block;height:8px;border-radius:99px;background:rgba(128,128,128,.25);margin-top:8px;overflow:hidden}
.fdt b{display:block;height:100%;border-radius:99px;background:var(--c1,#00f900);box-shadow:0 0 10px var(--c1,#00f900);transition:width .5s ease}
.pc{position:relative}
.hrt{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid var(--ln);background:rgba(0,0,0,.55);font-size:17px;line-height:1;cursor:pointer;color:inherit;backdrop-filter:blur(4px)}
.hrt.on{box-shadow:0 0 12px rgba(255,60,90,.55)}
html[data-favf="1"] .pc:not([data-fav]){display:none}
/* Admin sur ordinateur : onglets visibles (retour à la ligne) + panneau sombre lisible sur n'importe quel fond */
:root:root .aw{background:rgba(4,7,4,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (min-width:700px){
:root:root .aw .rw{flex-wrap:wrap;overflow:visible;row-gap:8px}
:root:root .aw{padding-left:22px;padding-right:22px;border-radius:0 0 22px 22px}
}
@media (min-width:1200px){:root:root .aw{max-width:min(1240px,96vw)}}
/* ===== FULL DESIGN + FULL ANIMATION (coupés par l'interrupteur d'effets et « réduire les animations ») ===== */
html{scrollbar-color:var(--c1,#00f900) #050805}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#050805}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--c1,#00f900),#0a7d0a);border-radius:10px;border:2px solid #050805}
::selection{background:var(--c1,#00f900);color:#000}
#spb{position:fixed;top:0;left:0;height:3px;width:0;z-index:99999;pointer-events:none;background:linear-gradient(90deg,var(--c1,#00f900),#fff);box-shadow:0 0 12px var(--c1,#00f900)}
#cgl{position:fixed;left:0;top:0;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;background:radial-gradient(circle,color-mix(in srgb,var(--c1,#00f900) 17%,transparent),transparent 65%);mix-blend-mode:screen;transition:opacity .4s}
html[data-fx=off] #spb,html[data-fx=off] #cgl{display:none}
@media (prefers-reduced-motion:no-preference){
html[data-fx=on] body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,color-mix(in srgb,var(--c1,#00f900) 26%,transparent),transparent 70%),radial-gradient(35% 30% at 80% 72%,color-mix(in srgb,var(--c1,#00f900) 17%,transparent),transparent 70%),radial-gradient(30% 30% at 72% 14%,rgba(0,200,255,.11),transparent 70%);filter:blur(24px);animation:xaur 24s ease-in-out infinite alternate}
@keyframes xaur{to{transform:translate3d(5%,-4%,0) rotate(7deg) scale(1.1)}}
html[data-fx=on] #app h2::after{content:'';display:block;height:3px;width:56px;margin-top:9px;border-radius:3px;background:var(--c1,#00f900);box-shadow:0 0 14px var(--c1,#00f900);animation:xul 3.4s ease-in-out infinite}
@keyframes xul{50%{width:130px}}
html[data-fx=on] .b{transition:transform .14s ease,box-shadow .25s ease,filter .25s ease}
html[data-fx=on] .b:active{transform:scale(.95)}
html[data-fx=on] :is(.cd,.ib,.zc){background-image:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,0) 42%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[data-fx=on] :is(.ib,.cd){transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease}
html[data-fx=on] .t3.today{animation:xbd 2.4s ease-in-out infinite}
@keyframes xbd{50%{border-color:var(--c1,#00f900);box-shadow:0 0 22px color-mix(in srgb,var(--c1,#00f900) 40%,transparent)}}
html[data-fx=on] .zc[open]>:not(summary){animation:xdn .38s ease both}
@keyframes xdn{from{opacity:0;transform:translateY(-10px)}}
html[data-fx=on] .ch{transition:transform .2s ease,box-shadow .25s ease}
html[data-fx=on] .ch.on{animation:xchg 2.8s ease-in-out infinite}
@keyframes xchg{50%{box-shadow:0 0 24px color-mix(in srgb,var(--c1,#00f900) 65%,transparent)}}
html[data-fx=on] .brand img{animation:xflt 5.5s ease-in-out infinite;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c1,#00f900) 55%,transparent))}
@keyframes xflt{50%{transform:translateY(-7px)}}
html[data-fx=on] #m.op .sh{animation:xsh .42s cubic-bezier(.2,.9,.3,1.15)}
html[data-fx=on] #m.op .ov{animation:xfd .28s ease}
@keyframes xsh{from{transform:translateY(44px) scale(.96);opacity:0}}
@keyframes xfd{from{opacity:0}}
html[data-fx=on] .ts{animation:xts .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes xts{from{transform:translateY(24px) scale(.9);opacity:0}}
html[data-fx=on] .xo{opacity:0;transform:translateY(22px)}
html[data-fx=on] .xo.xin{opacity:1;transform:none;transition:opacity .65s ease,transform .65s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--j,0)*70ms)}
@media (hover:hover) and (pointer:fine){
:root:root[data-fx=on] .pc:not(.pre),:root:root[data-fx=on] .pc:not(.pre):hover{transform:perspective(760px) translateY(var(--ty,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .18s ease-out,box-shadow .3s ease;will-change:transform}
:root:root[data-fx=on] .pc:not(.pre):hover{--ty:-6px;box-shadow:0 22px 44px rgba(0,0,0,.55),0 0 30px color-mix(in srgb,var(--c1,#00f900) 48%,transparent)}
html[data-fx=on] .pc .pi{transition:transform .55s ease}html[data-fx=on] .pc:hover .pi{transform:scale(1.07)}

html[data-fx=on] .ch:hover{transform:translateY(-2px)}
}}
/* Neige + montagnes */

/* ═══ TYPO « Glacier » : Anton (titres) · Montserrat (étiquettes, boutons) · Lora italique (descriptions) · DM Sans (texte) ═══ */
:root{--f3:'Anton','Oswald',Impact,'Arial Narrow',sans-serif;--f4:'Montserrat','DM Sans',system-ui,sans-serif;--fs:'Lora',Georgia,'Times New Roman',serif;--tg:0 2px 0 rgba(0,0,0,.5),0 0 22px color-mix(in srgb,var(--c1,#00f900) 42%,transparent)}
html[data-t3=off]{--tg:0 1px 0 rgba(0,0,0,.4)}
html{font-synthesis-weight:none}
body{font-family:var(--f2);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal}
/* — Titres : Anton en capitales aérées, halo discret, ornement losange + filet qui s'efface — */
#app .w:not(.aw)>h2,#app .tx h2,#app .brand b,#m .sh h2,#ag .agc h2,#sp h1{font-family:var(--f3);font-weight:400;text-transform:uppercase;letter-spacing:.06em;line-height:1.1;color:#f6fffa;-webkit-text-fill-color:currentColor;background:none;-webkit-background-clip:border-box;background-clip:border-box;text-shadow:var(--tg);text-wrap:balance}
#app .w:not(.aw)>h2{font-size:clamp(26px,7.6vw,32px);display:flex;align-items:center;margin-bottom:14px}
#app .w:not(.aw)>h2::before{content:"";position:static;flex:none;width:9px;height:9px;margin:0 13px 0 2px;padding:0;border:0;border-radius:2px;rotate:45deg;transform:none;animation:none;opacity:1;background:linear-gradient(135deg,#fff,var(--c1,#00f900));box-shadow:0 0 12px var(--c1,#00f900)}
#app .w:not(.aw)>h2::after{content:"";flex:1 1 auto;min-width:20px;width:auto;height:1px;margin:3px 0 0 16px;padding:0;border-radius:0;transform:none;animation:none;opacity:1;background:linear-gradient(90deg,color-mix(in srgb,var(--c1,#00f900) 85%,transparent),transparent);box-shadow:none}
#app .brand b{font-size:clamp(34px,10vw,44px)}
#m .sh h2{font-size:clamp(24px,7vw,30px)}
#app .tx h2{font-size:26px}
#sp h1{font-size:clamp(40px,12.5vw,66px);line-height:1.04}
#sp p{font-family:var(--fs);font-style:italic;font-weight:400;font-size:clamp(16px,4.4vw,19px);line-height:1.6}
/* — Étiquettes, boutons et chiffres — */
#app .ih b,#app .th3 b,#app .hrs summary,#m .sh h3{font-family:var(--f4);font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
#app .hrs summary{font-size:11.5px;letter-spacing:.14em}
#app .th3 b{font-size:10px;letter-spacing:.14em}
#app .ib .tm{font-family:var(--f3);font-weight:400;font-size:clamp(18px,5.3vw,22px);letter-spacing:.06em;font-variant-numeric:tabular-nums}
#app .st{font-family:var(--f3);font-weight:400;font-size:clamp(9px,2.7vw,11.5px);letter-spacing:.06em;padding-inline:10px;text-transform:uppercase}
#app .ch{font-family:var(--f4);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
#app .csb{font-family:var(--f4);font-weight:800;font-size:9px;letter-spacing:.1em}
#app .pi>b{font-family:var(--f3);font-weight:400;font-size:18px;letter-spacing:.05em;line-height:1.15}
#app .pi>.mu{font-family:var(--f3);font-weight:400;font-size:17px;letter-spacing:.05em;font-variant-numeric:tabular-nums}
#app .cd>b{font-family:var(--f3);font-weight:400;font-size:18px;letter-spacing:.1em}

const DESCFN="// Fonction Supabase « describe » : rédige les descriptions produits (réservée à l'administrateur).\n// Utilise l'API gratuite de Groq. Secrets : GROQ_API_KEY (obligatoire), GROQ_MODEL (facultatif).\nconst SU = Deno.env.get(\"SUPABASE_URL\")!;\nconst SK = Deno.env.get(\"SUPABASE_SERVICE_ROLE_KEY\")!;\nconst AK = Deno.env.get(\"GROQ_API_KEY\") || \"\";\nconst MODEL = Deno.env.get(\"GROQ_MODEL\") || \"llama-3.3-70b-versatile\";\nconst FALLBACKS = [\"llama-3.1-8b-instant\"];\nconst CORS = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"authorization, x-client-info, apikey, content-type\",\n  \"Access-Control-Allow-Methods\": \"POST, OPTIONS\",\n};\nconst J = (o: unknown, s = 200) =>\n  new Response(JSON.stringify(o), { status: s, headers: { ...CORS, \"Content-Type\": \"application/json\" } });\n\nasync function isAdmin(req: Request) {\n  const t = (req.headers.get(\"authorization\") || \"\").replace(/^Bearer\\s+/i, \"\");\n  if (!t) return false;\n  const r = await fetch(`${SU}/auth/v1/user`, { headers: { apikey: SK, Authorization: `Bearer ${t}` } });\n  if (!r.ok) return false;\n  const u = await r.json();\n  if (!u?.id) return false;\n  const p = await (await fetch(`${SU}/rest/v1/profiles?select=is_admin&id=eq.${u.id}`, {\n    headers: { apikey: SK, Authorization: `Bearer ${SK}` },\n  })).json();\n  return !!p?.[0]?.is_admin;\n}\n\nconst SYSTEM = [\n  \"Tu es rédacteur e-commerce pour une boutique en ligne francophone. Écris toujours en français.\",\n  \"À partir du nom du produit et de 2 à 3 mots-clés, écris une description courte (3 à 5 phrases, 60 à 90 mots), vivante et enjouée, qui donne envie d'acheter.\",\n  \"Termine par un appel à l'action (ex. Commandez-le dès maintenant). Place 3 à 6 emojis bien choisis, sans en abuser. Vouvoie le client.\",\n  \"Règles : n'invente aucun fait (taux, origine, laboratoire, prix) absent des infos fournies ; aucune promesse de santé ou thérapeutique (soulage, soigne, traite…) ; aucune allégation d'effets ; produit réservé aux adultes.\",\n  \"Réponds uniquement avec le texte de la description, sans titre ni guillemets.\",\n].join(\"\\n\");\n\nconst ask = (model: string, info: string) =>\n  fetch(\"https://api.groq.com/openai/v1/chat/completions\", {\n    method: \"POST\",\n    headers: { Authorization: `Bearer ${AK}`, \"Content-Type\": \"application/json\" },\n    body: JSON.stringify({\n      model,\n      max_tokens: 400,\n      temperature: 0.8,\n      messages: [{ role: \"system\", content: SYSTEM }, { role: \"user\", content: info }],\n    }),\n  });\n\nDeno.serve(async (req) => {\n  if (req.method === \"OPTIONS\") return new Response(\"ok\", { headers: CORS });\n  try {\n    if (!(await isAdmin(req))) return J({ ok: false, error: \"Compte administrateur requis.\" }, 403);\n    if (!AK) return J({ ok: false, error: \"Secret GROQ_API_KEY manquant dans Supabase (Edge Functions → Secrets).\" }, 500);\n    const b = await req.json().catch(() => ({}));\n    const cut = (v: unknown, n: number) => String(v || \"\").trim().slice(0, n);\n    const info = [\n      \"Nom : \" + cut(b.n, 120),\n      \"Mots-clés : \" + cut(b.k, 200),\n      b.c ? \"Catégorie : \" + cut(b.c, 60) : \"\",\n      b.p ? \"Prix : \" + cut(b.p, 20) + \" €\" : \"\",\n    ].filter(Boolean).join(\"\\n\");\n\n    const models = Deno.env.get(\"GROQ_MODEL\") ? [MODEL] : [MODEL, ...FALLBACKS];\n    let r: Response | null = null;\n    for (const m of models) {\n      r = await ask(m, info);\n      console.log(\"DESCRIBE groq model=\" + m + \" status=\" + r.status);\n      // 401/403 = clé refusée : inutile d'essayer un autre modèle\n      if (r.ok || r.status === 401 || r.status === 403) break;\n    }\n    const j = await r!.json().catch(() => ({}));\n    if (!r!.ok) {\n      const msg = j?.error?.message || j?.message || \"Erreur du service de rédaction.\";\n      console.error(\"DESCRIBE groq error status=\" + r!.status + \" body=\" + JSON.stringify(j).slice(0, 400));\n      return J({ ok: false, error: \"Groq \" + r!.status + \" : \" + (typeof msg === \"string\" ? msg : JSON.stringify(msg)), upstream: r!.status }, 502);\n    }\n    const text = String(j?.choices?.[0]?.message?.content || \"\").trim();\n    return J({ ok: !!text, text });\n  } catch (e) {\n    console.error(\"DESCRIBE exception \" + String((e as Error)?.message || e));\n    return J({ ok: false, error: String((e as Error)?.message || e) }, 500);\n  }\n});\n";

create or replace function public.guard_pts() returns trigger language plpgsql as $$
begin
  if new.points is distinct from old.points and coalesce(current_setting('app.pts', true), '') <> '1' then
    raise exception 'interdit';
  end if;
  return new;
end $$;
drop trigger if exists guard_pts on public.profiles;
create trigger guard_pts before update on public.profiles for each row execute function public.guard_pts();

create or replace function public.add_points(p_uid uuid, p_delta integer) returns integer
language plpgsql security definer set search_path = public as $$
declare adm boolean; res integer;
begin
  select is_admin into adm from public.profiles where id = auth.uid();
  if not coalesce(adm, false) then raise exception 'interdit'; end if;
  perform set_config('app.pts', '1', true);
  update public.profiles set points = greatest(0, points + p_delta) where id = p_uid returning points into res;
  return res;
end $$;
grant execute on function public.add_points(uuid, integer) to authenticated;`;

create or replace function public.mark_read(p_uid uuid) returns void
language plpgsql security definer set search_path = public as $$
declare adm boolean;
begin
  select is_admin into adm from public.profiles where id = auth.uid();
  if coalesce(adm, false) then
    update public.messages set seen = true where user_id = p_uid and from_admin = false and not seen;
  elsif auth.uid() = p_uid then
    update public.messages set seen = true where user_id = p_uid and from_admin = true and not seen;
  end if;
end $$;
grant execute on function public.mark_read(uuid) to authenticated;

-- Support : assistant (bot) puis prise en main par la boutique
alter table public.messages add column if not exists from_bot boolean not null default false;
alter table public.messages add column if not exists bot_chat boolean not null default false;
create or replace function public.is_admin() returns boolean language sql stable security definer set search_path = public as $$
  select coalesce((select is_admin from public.profiles where id = auth.uid()), false)
$$;
create table if not exists public.support_threads (
  user_id uuid primary key references public.profiles(id) on delete cascade,
  mode text not null default 'bot' check (mode in ('bot', 'human')),
  needs_human boolean not null default false,
  updated_at timestamptz not null default now()
);
alter table public.support_threads enable row level security;
drop policy if exists support_threads_sel on public.support_threads;
create policy support_threads_sel on public.support_threads for select using (user_id = auth.uid() or public.is_admin());
drop policy if exists msg_ins_c on public.messages;
create policy msg_ins_c on public.messages for insert with check (user_id = auth.uid() and from_admin = false and seen = false and from_bot = false and bot_chat = false);
drop policy if exists msg_ins_bot on public.messages;
create policy msg_ins_bot on public.messages for insert with check (user_id = auth.uid() and from_admin = false and bot_chat = true);
create or replace function public.messages_before_ins() returns trigger language plpgsql set search_path = public as $$
begin
  if new.from_bot then new.bot_chat := true; new.from_admin := false; end if;
  if new.bot_chat then new.seen := true; end if;
  return new;
end $$;
create or replace function public.messages_after_ins() returns trigger language plpgsql security definer set search_path = public as $$
begin
  if new.from_admin and not new.from_bot then
    insert into public.support_threads (user_id, mode, needs_human, updated_at) values (new.user_id, 'human', false, now())
      on conflict (user_id) do update set mode = 'human', needs_human = false, updated_at = now();
  elsif not new.from_admin and not new.bot_chat then
    update public.support_threads set updated_at = now() where user_id = new.user_id and mode = 'human';
  end if;
  return new;
exception when others then return new;
end $$;
drop trigger if exists messages_before_ins on public.messages;
create trigger messages_before_ins before insert on public.messages for each row execute function public.messages_before_ins();
drop trigger if exists messages_after_ins on public.messages;
create trigger messages_after_ins after insert on public.messages for each row execute function public.messages_after_ins();
create or replace function public.support_ask_human() returns void language plpgsql security definer set search_path = public as $$
declare uid uuid := auth.uid(); t record;
begin
  if uid is null then raise exception 'Connexion requise.'; end if;
  select * into t from public.support_threads where user_id = uid;
  insert into public.support_threads (user_id, mode, needs_human, updated_at) values (uid, 'human', true, now())
    on conflict (user_id) do update set mode = 'human', needs_human = true, updated_at = now();
  if not found or t.user_id is null or not t.needs_human or t.updated_at < now() - interval '10 minutes' then
    insert into public.messages (user_id, from_admin, body) values (uid, false, '🙋 Je souhaite parler à la boutique.');
  end if;
end $$;
create or replace function public.support_take(p_uid uuid) returns void language plpgsql security definer set search_path = public as $$
begin
  if not public.is_admin() then raise exception 'Administrateur requis.'; end if;
  insert into public.support_threads (user_id, mode, needs_human, updated_at) values (p_uid, 'human', false, now())
    on conflict (user_id) do update set mode = 'human', needs_human = false, updated_at = now();
end $$;
create or replace function public.support_release(p_uid uuid) returns void language plpgsql security definer set search_path = public as $$
begin
  if not public.is_admin() then raise exception 'Administrateur requis.'; end if;
  insert into public.support_threads (user_id, mode, needs_human, updated_at) values (p_uid, 'bot', false, now())
    on conflict (user_id) do update set mode = 'bot', needs_human = false, updated_at = now();
  insert into public.messages (user_id, from_bot, bot_chat, body)
    values (p_uid, true, true, '🤖 L’assistant reprend la conversation. Posez-moi vos questions, ou touchez « Parler à la boutique » si vous préférez un conseiller.');
end $$;
revoke all on function public.support_ask_human() from public, anon;
revoke all on function public.support_take(uuid) from public, anon;
revoke all on function public.support_release(uuid) from public, anon;
grant execute on function public.support_ask_human() to authenticated;
grant execute on function public.support_take(uuid) to authenticated;
grant execute on function public.support_release(uuid) to authenticated;`,

const PNSW="/* Service worker des notifications : généré par l’administration du site */\nvar ICON='__ICON__';\nself.addEventListener('install',function(){self.skipWaiting()});\nself.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});\nself.addEventListener('push',function(e){\n  var d={};\n  try{d=e.data?e.data.json():{}}catch(x){d={t:'Notification',b:e.data?e.data.text():''}}\n  var o={body:d.b||'',data:{u:d.u||''},lang:'fr'};\n  if(ICON)o.icon=ICON;\n  if(d.i)o.image=d.i;\n  if(d.g){o.tag=d.g;o.renotify=true}\n  e.waitUntil(self.registration.showNotification((d.t||'').trim(),o).then(function(){\n    try{if(self.navigator.setAppBadge)self.navigator.setAppBadge()}catch(x){}\n    return self.clients.matchAll({type:'window',includeUncontrolled:true}).then(function(L){\n      L.forEach(function(c){try{c.postMessage({k:'push',d:d})}catch(x){}})\n    })\n  }));\n});\nself.addEventListener('notificationclick',function(e){\n  e.notification.close();\n  var u=(e.notification.data||{}).u||'',base=self.registration.scope;\n  e.waitUntil(self.clients.matchAll({type:'window',includeUncontrolled:true}).then(function(L){\n    for(var i=0;i<L.length;i++){\n      if(L[i].url.indexOf(base)===0){\n        try{L[i].postMessage({k:'go',u:u})}catch(x){}\n        return L[i].focus?L[i].focus():undefined;\n      }\n    }\n    return self.clients.openWindow(base+u);\n  }));\n});\n",PNFN="// Fonction Supabase « push » : envoie les notifications de la boutique (Web Push).\n// Secrets à créer : VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT.\nconst SU = Deno.env.get(\"SUPABASE_URL\")!;\nconst SK = Deno.env.get(\"SUPABASE_SERVICE_ROLE_KEY\")!;\nconst VPUB = Deno.env.get(\"VAPID_PUBLIC_KEY\") || \"\";\nconst VPRIV = Deno.env.get(\"VAPID_PRIVATE_KEY\") || \"\";\nconst VSUB = Deno.env.get(\"VAPID_SUBJECT\") || \"mailto:contact@example.com\";\nconst CORS = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"authorization, x-client-info, apikey, content-type\",\n  \"Access-Control-Allow-Methods\": \"POST, OPTIONS\",\n};\nconst J = (o: unknown, s = 200) =>\n  new Response(JSON.stringify(o), { status: s, headers: { ...CORS, \"Content-Type\": \"application/json\" } });\n\n/* ---------- Chiffrement Web Push (RFC 8291) et signature VAPID (RFC 8292) ---------- */\nconst te = new TextEncoder();\nconst b64u = (b: ArrayBuffer | Uint8Array) => {\n  let s = \"\";\n  for (const c of new Uint8Array(b)) s += String.fromCharCode(c);\n  return btoa(s).replace(/\\+/g, \"-\").replace(/\\//g, \"_\").replace(/=+$/, \"\");\n};\nconst unb64u = (s: string) => {\n  s = s.replace(/-/g, \"+\").replace(/_/g, \"/\");\n  while (s.length % 4) s += \"=\";\n  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));\n};\nconst cat = (...a: Uint8Array[]) => {\n  const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0));\n  let i = 0;\n  for (const x of a) { o.set(x, i); i += x.length; }\n  return o;\n};\nconst hkdf = async (salt: Uint8Array, ikm: Uint8Array, info: Uint8Array, len: number) =>\n  new Uint8Array(await crypto.subtle.deriveBits(\n    { name: \"HKDF\", hash: \"SHA-256\", salt, info },\n    await crypto.subtle.importKey(\"raw\", ikm, \"HKDF\", false, [\"deriveBits\"]),\n    len * 8,\n  ));\n\nasync function encrypt(p256dh: string, auth: string, data: Uint8Array, eph?: CryptoKeyPair, salt?: Uint8Array) {\n  const ua = unb64u(p256dh), au = unb64u(auth);\n  const kp = eph || (await crypto.subtle.generateKey({ name: \"ECDH\", namedCurve: \"P-256\" }, true, [\"deriveBits\"]));\n  const asPub = new Uint8Array(await crypto.subtle.exportKey(\"raw\", kp.publicKey));\n  const uaKey = await crypto.subtle.importKey(\"raw\", ua, { name: \"ECDH\", namedCurve: \"P-256\" }, false, []);\n  const secret = new Uint8Array(await crypto.subtle.deriveBits({ name: \"ECDH\", public: uaKey }, kp.privateKey, 256));\n  const ikm = await hkdf(au, secret, cat(te.encode(\"WebPush: info\\0\"), ua, asPub), 32);\n  const sl = salt || crypto.getRandomValues(new Uint8Array(16));\n  const cek = await hkdf(sl, ikm, te.encode(\"Content-Encoding: aes128gcm\\0\"), 16);\n  const nonce = await hkdf(sl, ikm, te.encode(\"Content-Encoding: nonce\\0\"), 12);\n  const key = await crypto.subtle.importKey(\"raw\", cek, \"AES-GCM\", false, [\"encrypt\"]);\n  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: \"AES-GCM\", iv: nonce }, key, cat(data, new Uint8Array([2]))));\n  return cat(sl, new Uint8Array([0, 0, 16, 0, 65]), asPub, ct);\n}\n\nasync function vapid(endpoint: string) {\n  const h = b64u(te.encode(JSON.stringify({ typ: \"JWT\", alg: \"ES256\" })));\n  const c = b64u(te.encode(JSON.stringify({\n    aud: new URL(endpoint).origin,\n    exp: Math.floor(Date.now() / 1000) + 12 * 3600,\n    sub: VSUB,\n  })));\n  const pub = unb64u(VPUB);\n  const key = await crypto.subtle.importKey(\n    \"jwk\",\n    { kty: \"EC\", crv: \"P-256\", x: b64u(pub.slice(1, 33)), y: b64u(pub.slice(33, 65)), d: VPRIV, ext: true },\n    { name: \"ECDSA\", namedCurve: \"P-256\" },\n    false,\n    [\"sign\"],\n  );\n  const sig = await crypto.subtle.sign({ name: \"ECDSA\", hash: \"SHA-256\" }, key, te.encode(h + \".\" + c));\n  return `vapid t=${h}.${c}.${b64u(sig)}, k=${VPUB}`;\n}\n\n/* ---------- Base de données (clé service : jamais visible côté client) ---------- */\nconst db = (path: string, init: RequestInit = {}) =>\n  fetch(`${SU}/rest/v1/${path}`, {\n    ...init,\n    headers: {\n      apikey: SK,\n      Authorization: `Bearer ${SK}`,\n      \"Content-Type\": \"application/json\",\n      ...((init.headers as Record<string, string>) || {}),\n    },\n  });\n\nasync function who(req: Request) {\n  const t = (req.headers.get(\"authorization\") || \"\").replace(/^Bearer\\s+/i, \"\");\n  if (!t) return null;\n  const r = await fetch(`${SU}/auth/v1/user`, { headers: { apikey: SK, Authorization: `Bearer ${t}` } });\n  if (!r.ok) return null;\n  const u = await r.json();\n  if (!u?.id) return null;\n  const p = await (await db(`profiles?select=name,is_admin&id=eq.${u.id}`)).json();\n  return { id: String(u.id), name: String(p?.[0]?.name || \"\"), admin: !!p?.[0]?.is_admin };\n}\n\n// Une seule exécution par clé (évite les doublons de notification)\nasync function once(k: string) {\n  const r = await db(\"push_log?on_conflict=k\", {\n    method: \"POST\",\n    headers: { Prefer: \"resolution=ignore-duplicates,return=representation\" },\n    body: JSON.stringify({ k }),\n  });\n  if (Math.random() < 0.02) {\n    db(\"push_log?ts=lt.\" + encodeURIComponent(new Date(Date.now() - 3 * 864e5).toISOString()), { method: \"DELETE\" });\n  }\n  const j = await r.json().catch(() => []);\n  return Array.isArray(j) && j.length > 0;\n}\n\n// Seuls les vrais services de notification des navigateurs sont acceptés\nconst OK_ENDPOINT =\n  /^https:\\/\\/(fcm\\.googleapis\\.com|[a-z0-9.-]+\\.push\\.services\\.mozilla\\.com|web\\.push\\.apple\\.com|[a-z0-9.-]+\\.notify\\.windows\\.com)\\//;\n\ntype Sub = { endpoint: string; p256dh: string; auth: string };\n\nasync function sendAll(subs: Sub[], payload: object) {\n  const data = te.encode(JSON.stringify(payload));\n  let sent = 0, fail = 0;\n  const gone: string[] = [];\n  for (let i = 0; i < subs.length; i += 15) {\n    await Promise.all(subs.slice(i, i + 15).map(async (s) => {\n      try {\n        const r = await fetch(s.endpoint, {\n          method: \"POST\",\n          headers: {\n            Authorization: await vapid(s.endpoint),\n            \"Content-Encoding\": \"aes128gcm\",\n            \"Content-Type\": \"application/octet-stream\",\n            TTL: \"86400\",\n            Urgency: \"high\",\n          },\n          body: await encrypt(s.p256dh, s.auth, data),\n        });\n        if (r.status === 404 || r.status === 410) gone.push(s.endpoint);\n        else if (r.ok) sent++;\n        else fail++;\n        await r.body?.cancel();\n      } catch { fail++; }\n    }));\n  }\n  for (const e of gone) await db(\"push_subs?endpoint=eq.\" + encodeURIComponent(e), { method: \"DELETE\" });\n  return { sent, fail, removed: gone.length };\n}\n\nconst subsOf = async (filter: string): Promise<Sub[]> =>\n  await (await db(\"push_subs?select=endpoint,p256dh,auth\" + filter)).json();\nconst pl = (t: unknown, b: unknown, u: unknown, g?: unknown, i?: unknown) => ({\n  t: String(t || \"\").slice(0, 80),\n  b: String(b || \"\").slice(0, 160),\n  u: /^#[\\w-]{0,60}$/.test(String(u || \"\")) ? String(u) : \"\",\n  g: g ? String(g).slice(0, 40) : undefined,\n  i: /^https:\\/\\/[^\\s\"'<>]{4,300}$/.test(String(i || \"\")) ? String(i) : undefined,\n});\nconst clean = (s: unknown) => String(s || \"\").replace(/[^\\w-]/g, \"\").slice(0, 40);\n\nDeno.serve(async (req) => {\n  if (req.method === \"OPTIONS\") return new Response(\"ok\", { headers: CORS });\n  try {\n    const b = await req.json().catch(() => ({}));\n    const a = String(b.a || \"\");\n    const u = await who(req);\n    const needAdmin = () => (u?.admin ? null : J({ ok: false, error: \"Compte administrateur requis.\" }, 403));\n\n    if (a === \"ping\") {\n      const t1 = await db(\"push_subs?select=endpoint&limit=1\");\n      const t2 = await db(\"push_log?select=k&limit=1\");\n      await t1.body?.cancel(); await t2.body?.cancel();\n      return J({\n        ok: true,\n        vapid: !!(VPUB && VPRIV),\n        vk: VPUB,\n        nv: 2,\n        tables: t1.ok && t2.ok,\n        role: u ? (u.admin ? \"admin\" : \"client\") : \"anon\",\n        subs: u?.admin && t1.ok ? (await subsOf(\"\")).length : undefined,\n      });\n    }\n\n    if (a === \"sub\") {\n      const s = b.sub || {}, k = s.keys || {}, ep = String(s.endpoint || \"\");\n      if (!OK_ENDPOINT.test(ep) || unb64u(String(k.p256dh || \"\")).length !== 65 || unb64u(String(k.auth || \"\")).length < 16) {\n        return J({ ok: false, error: \"Abonnement invalide.\" }, 400);\n      }\n      const r = await db(\"push_subs?on_conflict=endpoint\", {\n        method: \"POST\",\n        headers: { Prefer: \"resolution=merge-duplicates,return=minimal\" },\n        body: JSON.stringify({\n          endpoint: ep, p256dh: k.p256dh, auth: k.auth,\n          user_id: u?.id || null, is_admin: !!u?.admin, ua: String(b.ua || \"\").slice(0, 120),\n        }),\n      });\n      return J({ ok: r.ok, role: u ? (u.admin ? \"admin\" : \"client\") : \"anon\" }, r.ok ? 200 : 500);\n    }\n\n    if (a === \"unsub\") {\n      await db(\"push_subs?endpoint=eq.\" + encodeURIComponent(String(b.endpoint || \"\")), { method: \"DELETE\" });\n      return J({ ok: true });\n    }\n\n    if (a === \"test\") {\n      if (!u) return J({ ok: false, error: \"Connexion requise.\" }, 401);\n      return J({ ok: true, ...(await sendAll(await subsOf(\"&user_id=eq.\" + u.id), pl(\"🔔 Notifications actives\", \"Test réussi : vous recevrez ici les messages et les actualités.\", \"\"))) });\n    }\n\n    if (a === \"send\") {\n      const no = needAdmin(); if (no) return no;\n      const f = b.aud === \"members\" ? \"&user_id=not.is.null\" : \"\";\n      return J({ ok: true, ...(await sendAll(await subsOf(f), pl(b.t, b.d, b.u, b.g, b.i))) });\n    }\n\n    if (a === \"news\") {\n      const no = needAdmin(); if (no) return no;\n      const id = clean(b.id);\n      if (!b.force && !(await once(\"n:\" + id))) return J({ ok: true, dup: true });\n      const f = b.pub ? \"\" : \"&user_id=not.is.null\";\n      return J({ ok: true, ...(await sendAll(await subsOf(f), pl(\"📰 \" + (b.t || \"Nouvelle actualité\"), b.d || \"Touchez pour la découvrir.\", \"#actu-\" + id, \"news-\" + id, b.i))) });\n    }\n\n    if (a === \"msg_admin\") {\n      if (!u) return J({ ok: false, error: \"Connexion requise.\" }, 401);\n      const mid = Number(b.mid) || 0;\n      const m = (await (await db(`messages?select=id,user_id,from_admin,body,created_at&id=eq.${mid}`)).json())?.[0];\n      if (!m || m.user_id !== u.id || m.from_admin || Date.now() - Date.parse(m.created_at) > 3e5) {\n        return J({ ok: false, error: \"Message introuvable.\" }, 403);\n      }\n      if (!(await once(\"m:\" + mid)) || !(await once(`u:${u.id}:${Math.floor(Date.now() / 2e4)}`))) return J({ ok: true, dup: true });\n      return J({ ok: true, ...(await sendAll(await subsOf(\"&is_admin=eq.true\"), pl(\"💬 \" + (u.name || \"Un client\"), m.body, \"#adm-msg-\" + u.id, \"msg-\" + u.id))) });\n    }\n\n    if (a === \"msg_client\") {\n      const no = needAdmin(); if (no) return no;\n      const mid = Number(b.mid) || 0;\n      const m = (await (await db(`messages?select=id,user_id,from_admin,body,created_at&id=eq.${mid}`)).json())?.[0];\n      if (!m || !m.from_admin || Date.now() - Date.parse(m.created_at) > 3e5) return J({ ok: false, error: \"Message introuvable.\" }, 403);\n      if (!(await once(\"m:\" + mid))) return J({ ok: true, dup: true });\n      return J({ ok: true, ...(await sendAll(await subsOf(\"&user_id=eq.\" + m.user_id), pl(String(b.t || \"\").trim().slice(0, 60), m.body, \"#compte-msg\", \"msg\"))) });\n    }\n\n    return J({ ok: false, error: \"Action inconnue.\" }, 400);\n  } catch (e) {\n    return J({ ok: false, error: String((e as Error)?.message || e) }, 500);\n  }\n});\n",PNSQL="-- À lancer UNE fois : Supabase > SQL Editor > New query > Run\ncreate table if not exists public.push_subs (\n  endpoint text primary key,\n  p256dh text not null,\n  auth text not null,\n  user_id uuid references public.profiles(id) on delete cascade,\n  is_admin boolean not null default false,\n  ua text,\n  created_at timestamptz not null default now()\n);\ncreate index if not exists push_subs_user_idx on public.push_subs (user_id);\ncreate index if not exists push_subs_admin_idx on public.push_subs (is_admin) where is_admin;\nalter table public.push_subs enable row level security;\ncreate table if not exists public.push_log (\n  k text primary key,\n  ts timestamptz not null default now()\n);\nalter table public.push_log enable row level security;\n-- Aucune règle d’accès : seule la fonction « push » (clé service) lit et écrit ces
